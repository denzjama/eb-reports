<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

ne": "positive", "promise": "Pay at each person's top of market; benefits that keep you covered", "match": "mixed", "note": "Five answers praise salary or call pay competitive. Two are critical: one asks for better bonuses and stock grants, one says family insurance cost most of a paycheck."}, {"theme": "Leadership and management", "mentions": 12, "of": 57, "tone": "mixed", "promise": "Managers practise context not control, coach actively and judge people on their whole record", "match": "tension", "note": "Four answers praise clear communication and approachability. Eight are critical, and three of them describe people being treated as expendable, gaslit or harmed."}, {"theme": "Colleagues and culture", "mentions": 19, "of": 57, "tone": "positive", "promise": "The Dream Team: stunning colleagues who work well together", "match": "consistent", "note": "Fourteen answers praise colleagues or the culture. Five are critical, one saying the memo is used against new recruits by cliquey teams."}, {"theme": "Freedom and autonomy", "mentions": 4, "of": 57, "tone": "positive", "promise": "People over process: freedom to make decisions about your own work", "match": "consistent", "note": "Three answers name independence or freedom. One describes being told to stay quiet in meetings and denied the tools for the job."}, {"theme": "Feedback and candor", "mentions": 4, "of": 57, "tone": "mixed", "promise": "Extraordinary candor; constructive feedback as part of everyday work", "match": "mixed", "note": "Three answers praise honest communication or recruiter feedback. One says feedback was given only when specifically requested."}, {"theme": "Hiring process", "mentions": 9, "of": 57, "tone": "mixed", "promise": "Published only for new grads and interns: a take-home assessment and two or about two to three rounds", "match": "not_addressed", "note": "Four answers praise openness and fair difficulty. Five are critical: one cites an average of 10 rounds, one asks to meet the hiring manager at least once."}, {"theme": "Workload and conditions", "mentions": 4, "of": 57, "tone": "mixed", "promise": "Uncomfortably exciting: bold, demanding work", "match": "mixed", "note": "Two answers value daily challenge and performance scores. Two ask for breaks or criticise cramped rooms."}, {"theme": "Growth and recognition", "mentions": 2, "of": 57, "tone": "mixed", "promise": "Many opportunities to develop and grow", "match": "mixed", "note": "One answer praises recognition awards; one sees politics and no proper growth. Too few answers to read a pattern."}, {"theme": "Inclusion", "mentions": 2, "of": 57, "tone": "mixed", "promise": "Inclusion and belonging; 18 employee resource groups", "match": "mixed", "note": "One answer praises an inclusive environment; one asks for female managers. Too few answers to read a pattern."}], "caveat": "The Comparably answers carry no dates, so whether they fall within the last 24 months cannot be checked. Seven of the 15 questions ask what should improve, so the balance of praise and criticism follows the question design. Four of the 57 answers are unclear or off-topic and were not assigned to themes; one more was left out for privacy. Department labels on the page were not used, because the layout does not show which answer each label belongs to. An answer can count under more than one theme."}, "manual_import": [{"platform": "LinkedIn company page and Life tab", "url": "https://www.linkedin.com/company/netflix", "capture": ["Header with bio and follower count", "The Life tab sections", "3 to 5 recent posts about people, work or hiring, opened with captions", "Pinned posts"]}, {"platform": "Instagram", "url": "https://www.instagram.com/netflix/", "capture": ["Profile header, and any careers or life-at account linked from the bio", "Grid of the latest 9 to 12 posts", "Any posts about people, work or hiring"]}, {"platform": "X", "url": "https://x.com/netflix", "capture": ["Profile header and pinned post", "Recent hiring or people posts; check whether a separate careers account exists"]}, {"platform": "Facebook", "url": "https://www.facebook.com/netflixus", "capture": ["Page header and About section", "Recent hiring or people posts"]}, {"platform": "TikTok", "url": "https://www.tiktok.com/@netflix", "capture": ["Profile header", "Recent posts about people, work or hiring"]}, {"platform": "Glassdoor", "url": "https://www.glassdoor.com/Reviews/Netflix-Reviews-E11891.htm", "capture": ["Rating page with overall rating, review count, recommend and CEO approval figures and the date", "15 or more reviews from the last 24 months, as text or screenshots, without author names"]}, {"platform": "Indeed", "url": "https://www.indeed.com/cmp/Netflix/reviews", "capture": ["Rating and review count", "10 to 15 recent reviews with dates"]}], "scope": {"reviewed": ["9 pages of jobs.netflix.com: home, culture memo, work life philosophy, inclusion, engineering and customer service role pages, new grads, internships and the Los Gatos location page", "8 job ads from explore.jobs.netflix.net across engineering, data, creative, advertising sales, games, infrastructure, animation and finance, chosen from 390 ads in the sitemaps", "The YouTube channel @Netflix, latest 15 uploads", "57 short answers on Comparably, as a perception layer outside the score", "Everything was captured from the public web on 2026-10-27"], "not_reviewed": ["Employee stories or interviews: none found in the public sources reviewed, so the employee-voice criterion was not scored", "The Netflix House careers site for venue roles: connection failed", "Customer service, hourly and entry-level job ads: none appeared in the 60-ad sample", "Closed platforms: LinkedIn, Instagram, X, Facebook, TikTok and Glassdoor; Indeed blocked automated access and InHerSight returned no data", "15 other role-family pages and 29 other location pages built on the same templates", "The interview experience itself, offers and onboarding"]}, "summary": {"points": ["The culture memo holds a proposition built on named practices: a team modelled on a professional sports team with the keeper test, a two-word vacation policy, and individual pay with a yearly choice between salary and stock options. It also says plainly who will not like working here.", "Little of this reaches the first screen. The home page offers “Join a star studded ensemble” and “Join our dream team”, and the customer service page gives no pay, schedule or location.", "Four of eight promises have meaningful support, none of them strong. Two of the five pillars rest on a Q1 2024 audience figure and a slogan, and growth and candor have no mechanism a candidate could check.", "The memo's “Take vacation.” line carries no scope. The work life page limits the no-prescribed-time-off rule to salaried employees, and two US ads give full-time hourly staff an accrual of 35 days.", "In 57 undated answers on Comparably, pay, colleagues and freedom draw mostly praise. Management draws 8 critical answers out of 12, three of them describing people treated as expendable or harmed. Reviews do not enter the score."], "actions": ["Put three or four of the memo's specifics, with their scope, on the home page and on every role-family page.", "Add the salaried scope to the memo's vacation line, state the hourly rule, and publish how experienced hires are interviewed.", "Collect attributable employee accounts and current figures for the pillars that now rest on audience size and slogans."]}, "dimensions": [{"id": "clarity", "score": 9, "max": 12, "assessable": true, "why": "The memo's opening paragraph states the offer and four principles carry it, so the hierarchy is clear. The home page shows only slogans, so the offer has to be read out of the memo. Job ads use internal terms and level numbers that no page explains.", "criteria": [{"name": "Employer proposition identifiable", "score": 3, "max": 4, "assessable": true, "note": "The memo's first paragraph describes an environment where talented people can thrive, built on four principles. The home page carries a mission line and two slogans."}, {"name": "Candidate benefit explicit", "score": 3, "max": 4, "assessable": true, "note": "The work life page and two ads speak to the reader directly (you choose salary versus options, you keep the options if you leave). Much of the memo describes what Netflix expects of people."}, {"name": "Message hierarchy", "score": 2, "max": 2, "assessable": true, "note": "One lead idea, the best work of our lives, with four principles beneath it; the Dream Team label recurs on every role page."}, {"name": "Accessibility", "score": 1, "max": 2, "assessable": true, "note": "The memo explains keeper test, informed captain and farming for dissent. Ads leave NAS, DSE, L6, the level numbers in titles, and Tudum and Queue unexplained."}]}, {"id": "differentiation", "score": 13, "max": 16, "assessable": true, "why": "Two of the five pillars depend on practices named only here: the sports-team model with the keeper test, and the two-word vacation and five-word expenses policies. Pay and Uncomfortably Exciting are partly specific. Great and Always Better and the home-page slogans fit any comparable employer.", "criteria": [{"name": "Resistance to substitution", "score": 4, "max": 5, "assessable": true, "note": "The Dream Team and People over Process claims break when another employer's name is put in; pay and Uncomfortably Exciting bend; Great and Always Better survives unchanged."}, {"name": "Avoidance of stock phrases", "score": 2, "max": 3, "assessable": true, "note": "Stock phrases recur (dream team, stunning colleagues, world-class, innovative, fast-paced), but in the memo they are outweighed by named policies. The home and customer service pages rely on them."}, {"name": "Employer-specific advantages", "score": 4, "max": 4, "assessable": true, "note": "The offer is built on the keeper test, the time-off and expenses policies, informed captains, the salary-or-options choice and 10-year fully vested options."}, {"name": "Defensibility", "score": 1, "max": 2, "assessable": true, "note": "The keeper test and parting ways quickly is a practice with a cost. The other pillars could be claimed by others with some effort."}, {"name": "Memorability", "score": 2, "max": 2, "assessable": true, "note": "The keeper test, a sports team not a family, and the two-word vacation policy are ideas about the work, and the vacation policy appears on two pages."}]}, {"id": "proof", "score": 9, "max": 16, "assessable": true, "why": "Four of eight promises have meaningful support: the Dream Team, People over Process, pay and inclusion. All four rest on described practices without outcome data, so none is strongly supported. Uncomfortably Exciting, Great and Always Better, candor and growth have only weak support.", "criteria": [{"name": "How many claims are supported", "score": 3, "max": 6, "assessable": true, "note": "Three of five core claims and one of three supporting claims are partly supported; the other four are weakly supported."}, {"name": "Specificity of the support", "score": 2, "max": 4, "assessable": true, "note": "Half the claims have support, and it is moderate throughout: policies and mechanisms without figures on outcomes."}, {"name": "Relevance of the support", "score": 2, "max": 3, "assessable": true, "note": "Support shows some claims. The time-off policy is scoped to salaried staff, and the scale claim is backed by a fact about members."}, {"name": "Support placed next to the claim", "score": 2, "max": 3, "assessable": true, "note": "In the memo and work life page the policies sit beside the promises they support; for the four weakly supported claims there is nothing to place."}]}, {"id": "audience_fit", "score": 8, "max": 12, "assessable": true, "why": "Engineers, new graduates and interns get pages built for them, and the memo makes explicit choices about who will not fit. The customer service page gives its audience a single paragraph with no conditions. The home page and memo speak to everyone at once.", "criteria": [{"name": "Audience definition", "score": 2, "max": 3, "assessable": true, "note": "Role-family, early-career and location pages name their audience; the home page and memo address all readers."}, {"name": "Motivation relevance", "score": 2, "max": 4, "assessable": true, "note": "Engineers get named teams and problems and, in one ad, a pay range. The customer service audience gets no pay, schedule or location."}, {"name": "Segmentation", "score": 2, "max": 3, "assessable": true, "note": "A shared Dream Team core with detailed adaptation for engineering and early careers; customer service is treated generically."}, {"name": "Trade-offs", "score": 2, "max": 2, "assessable": true, "note": "The memo says Netflix is not for everyone, describes the keeper test, and warns that employees may work on titles they perceive to be harmful."}]}, {"id": "employee_truth", "score": 7, "max": 10, "assessable": true, "why": "Job ads describe concrete tasks, tools and team set-ups, and the memo names its own failures and the hard side of its practices. No employee voice was found in the public sources reviewed, so that criterion was not scored.", "criteria": [{"name": "Employee voice", "score": 0, "max": 3, "assessable": false, "note": "Not scored: no employee stories or interviews were found in the public sources reviewed."}, {"name": "Work reality", "score": 3, "max": 3, "assessable": true, "note": "Ads name tools and set-ups: Swift and GraphQL for iOS, Nuke and quota targets for compositors, SQL for capacity planning, travel for the client partner."}, {"name": "Tensions and trade-offs", "score": 2, "max": 2, "assessable": true, "note": "The memo admits the keeper test can sound scary and says what is done about it, admits failures, and admits that a few people took advantage of the culture."}, {"name": "Behaviour over adjectives", "score": 2, "max": 2, "assessable": true, "note": "Culture is shown as practices: informed captains, farming for dissent, disagree then commit, memos open to comments."}]}, {"id": "consistency", "score": 10, "max": 12, "assessable": true, "why": "The Dream Team label, the culture memo and the pay approach repeat across the careers pages and ads in one recognisable voice. The time-off promise is told three ways across three touchpoints, and the memo version carries no scope.", "criteria": [{"name": "Core promise alignment", "score": 4, "max": 5, "assessable": true, "note": "Role pages and the iOS ad carry the Dream Team idea; the home page carries only the label, without the substance."}, {"name": "Proof alignment", "score": 3, "max": 3, "assessable": true, "note": "The work life page repeats the memo's time-off and expenses policies, and two ads repeat the pay mechanism with ranges."}, {"name": "Tone and message coherence", "score": 2, "max": 2, "assessable": true, "note": "The same phrases (entertain the world, stunning colleagues, Dream Team) and the same direct voice run across the pages."}, {"name": "Contradiction resistance", "score": 1, "max": 2, "assessable": true, "note": "The memo states the vacation policy without scope; the work life page limits it to salaried employees; two ads give hourly staff a 35-day accrual."}]}, {"id": "candidate_relevance", "score": 10, "max": 12, "assessable": true, "why": "The reasons to join are specific and the memo meets the obvious objections head on. Pay ranges were captured for two of eight ads, progression is not described, and the customer service page has no role reality.", "criteria": [{"name": "Why join", "score": 3, "max": 3, "assessable": true, "note": "High-performing colleagues, freedom with few rules and individually set pay are stated with their mechanisms."}, {"name": "Work and role reality", "score": 2, "max": 3, "assessable": true, "note": "Ads are concrete about tasks and teams; the customer service page and the job titles' level numbers leave key elements out."}, {"name": "Decision factors", "score": 2, "max": 3, "assessable": true, "note": "Location and work mode in every title, pay ranges in two ads, benefits and time off; no progression path in any page reviewed."}, {"name": "Candidate questions and doubts", "score": 3, "max": 3, "assessable": true, "note": "The memo takes on the keeper test, the risk of chaos and working on titles you may dislike; every page explains how to request an accommodation."}]}, {"id": "conversion", "score": 7, "max": 10, "assessable": true, "why": "Every page ends in a role search, and early-career pages say when roles open and how interviews run. Calls to action are generic, the home page CTA has no reasons beside it, and no process is described for experienced hires.", "criteria": [{"name": "Next-step clarity", "score": 3, "max": 3, "assessable": true, "note": "View-roles buttons and a search sit on every page; internship and new-grad pages say when roles are posted and that applications open when they go live."}, {"name": "Decision support near the call to action", "score": 1, "max": 2, "assessable": true, "note": "Role pages put a description above the button; the home page button sits beside slogans only."}, {"name": "Friction reduction", "score": 1, "max": 2, "assessable": true, "note": "Accommodation requests are explained and early-career interview steps are listed; effort and time to apply are not stated."}, {"name": "Call-to-action relevance", "score": 1, "max": 2, "assessable": true, "note": "Mostly generic view-roles buttons; the read-the-memo prompt on early-career pages fits that stage."}, {"name": "Process transparency", "score": 1, "max": 1, "assessable": true, "note": "Steps are described for new grads and interns: a take-home assessment, then two or about two to three rounds."}]}], "strengths": [{"title": "The memo says who should not apply", "text": "The culture memo ends its introduction with “But Netflix is not for everyone, so please read on.” It describes a team modelled on a professional sports team that will swap out someone it loves for a better player, says “Many people will be happier at companies that are more stable or take fewer risks.”, and warns that, depending on the role, employees may need to work on titles they perceive to be harmful. Each of these names a condition of the job that a reader can test against their own preferences."}, {"title": "Culture is shown as policies and named practices", "text": "The memo gives the vacation policy as two words and the expenses policy as five. It explains how decisions are made: an informed captain for every significant decision, farming for dissent, disagree then commit, and a reflection afterwards. The keeper test is spelled out with its two questions. Each term is explained where it first appears."}, {"title": "Pay mechanics are published in detail", "text": "The work life page says there is no raise pool, no set bands and grades, and no need to wait for an annual cycle to adjust pay. Employees choose each year between all cash, all options or a mix, and the 10-year options are fully vested and kept after leaving. The two ads with a captured pay section state a salary-only structure without bonuses and give ranges: $388,000 to $558,000 for the iOS role, varying by location, and $170,000 to $250,000 for the game producer."}, {"title": "The memo answers its own hardest objections", "text": "It admits the keeper test can sound scary and says what happens instead: regular conversations with managers, judgment on the whole record, and support through short-term bumps. It admits failures and that a few people took advantage of the culture. It says when managers must step in: unethical or harmful decisions, a crisis, or a new team member without full context."}, {"title": "Early-career routes say when and how", "text": "New grad roles are typically posted in late September or October; intern roles from late summer and early fall. Both pages describe a take-home assessment followed by interview rounds, give three preparation tips, and tell candidates they may be asked which parts of the memo resonate with them or not."}], "problems": [{"severity": "high", "title": "The home page and the customer service page carry slogans, not the offer.", "evidence": ["Home page: “Join a star studded ensemble”, “Join our dream team” and “Ready to Jump In the Spotlight?” around a role search. None of the memo's specifics (keeper test, time-off and expenses policies, pay approach) appears on it.", "Customer service page, the only page in the sample for service roles: one paragraph listing what the team handles, ending “And that’s sitting on the edge of their seats, waiting for the next thrill around the corner!” It states no pay, schedule, location or work mode."], "why": "The most specific part of the offer sits in one long document behind a menu item. The first screen gives a mission line and two slogans, which contain nothing specific to working at Netflix. The engineering page lists six engineering organisations and their groups; the customer service page names tasks and no conditions.", "flags": ["RF01", "RF11"]}, {"severity": "high", "title": "Two of the five pillars rest on audience size and a slogan, and the pay promise claims a market position the material does not measure.", "evidence": ["Culture memo: “Netflix is programming for well over half a billion** people globally — something no other entertainment company has ever done before.” The footnote derives the figure from about 260 million households as of Q1 2024 and an assumed two people per household.", "Culture memo: “We often say Netflix sucks today compared to where we can be tomorrow.” The pillar describes no practice through which employees improve the company.", "Work life page: “To help us attract and retain stunning colleagues, we pay employees at the top of their personal market.” No reference market or comparison is given."], "why": "Audience size is a fact about members. It shows nothing about what bold or experimental work means for an employee, and the figure dates from Q1 2024. The superlative about other entertainment companies and the top-of-market comparison have no source in the material. Next to these, the Dream Team and People over Process pillars are backed by named practices.", "flags": ["RF22", "RF02", "RF13"]}, {"severity": "medium", "title": "The best-known time-off line is stated without its scope.", "evidence": ["Culture memo, People over Process section: the vacation policy is given as the two words “Take vacation.”, with no group named.", "Work life page: “We don’t have a prescribed 9-to-5 workday, so we don’t have prescribed time off policies for salaried employees, either.”", "Software Engineer 5 iOS and Senior Game Producer ads: “Full-time hourly employees accrue 35 days annually for paid time off to be used for vacation, holidays, and sick paid time off.”"], "why": "Read together, the three touchpoints describe two regimes: no prescribed time off for salaried staff, and an accrual of 35 days for full-time hourly staff in two US ads. The memo, which the early-career pages tell candidates to read before interviews, gives only the first and leaves out the word salaried. The material does not say which roles are hourly or whether the hourly rule applies outside the US.", "flags": ["RF18", "RF12"]}, {"severity": "medium", "title": "Experienced candidates are not told how hiring works or what the levels in job titles mean.", "evidence": ["New grads page: interviews typically include a take-home assessment followed by two rounds. Internships page: a take-home assessment and about two to three rounds.", "All eight captured ads ask for prior experience, from 3+ years for the compositor to 8+ years for the data scientist and the client partner. Titles such as Software Engineer 5, Data Scientist 5 and Capacity Planner (L6) carry level numbers that no page reviewed explains."], "why": "Interview steps are published only for the early-career routes. The experienced-hire route, which all eight sampled ads belong to, has no description of steps, timing or who the candidate meets. The level numbers are the only signal of seniority in the titles, and their meaning is not given.", "flags": ["RF20", "RF19"]}, {"severity": "medium", "title": "Growth and candor are promised without a mechanism a candidate can check.", "evidence": ["Culture memo: “In reality, while we’ve had our fair share of failures — and a few people have taken advantage of our culture in bad ways — our emphasis on individual autonomy has created an extremely successful business, with many opportunities for employees to develop and grow.”", "Culture memo: “This, in turn, enables us to practice extraordinary candor — ensuring constructive feedback is part of our everyday work (like brushing your teeth).”"], "why": "The only development mechanism in the pages reviewed is the New Grad program's onboarding, training and development sessions, which cover new graduates. No path, internal move or progression between levels is described for anyone else. For candor, the memo sets an expectation and encourages regular talks with managers, but names no feedback practice, rhythm or example.", "flags": ["RF14"]}, {"severity": "low", "title": "The careers site leads to no social channel, and the main YouTube channel carries no content about people or work.", "evidence": ["No social account is linked from the three careers hosts in the content read; the job-ad site shows a follow-us label with no account links under it.", "YouTube @Netflix, latest 15 uploads (2026-10-22 to 2026-10-27): 0 of 15 are about people, work or hiring by title and description."], "why": "The candidate journey in the public sources reviewed ends at the careers site. No open channel shows the memo's practices through the people who use them. Closed platforms such as LinkedIn were not read, so this finding covers open sources only.", "flags": []}], "fixes": [{"title": "Bring the memo's specifics to the home page and every role-family page.", "needs_new_data": false, "steps": ["Replace the two home-page slogans with three or four short lines taken from the memo: the sports-team model and keeper test, the time-off and expenses policies with their scope, the pay approach, and the not-for-everyone line. Link each line to its memo section.", "Place the same short block above the view-roles button on each role-family page.", "On the customer service page, add pay, schedule, locations and work mode once the hiring team supplies them."], "why_first": "The facts already sit in candidate-facing copy, so most of the work is placement. It also gives the customer service page, now the thinnest role page, the same base as engineering.", "needs": ["For the customer service page only: pay range or pay logic, schedule or shift pattern, locations and work mode"], "effort": "small", "effort_note": "Rewording and moving existing copy; the customer service additions need one input from the hiring team", "who": ["Employer brand team", "Careers-site web team", "Customer service recruiting lead (pay, schedule, locations)"], "check": ["How many home-page visitors open the culture memo or the role search", "Whether customer service applicants still ask about pay and schedule at the first recruiter call"]}, {"title": "Scope the time-off line and publish how experienced hires are interviewed.", "needs_new_data": true, "steps": ["In the memo, add the salaried scope to the vacation sentence and state the hourly accrual already given in the US ads, with its geography once confirmed.", "Add a how-we-hire page for experienced roles: steps, typical timing, who the candidate meets, and whether the hiring manager is one of them.", "Explain the level numbers used in job titles on that page and link to it from every ad."], "why_first": "It removes the one inconsistency found between touchpoints and covers the route used by all eight sampled ads.", "needs": ["Whether the 35-day hourly accrual applies outside the US", "The interview steps and typical timing for experienced roles", "What the level numbers in titles mean"], "effort": "medium", "effort_note": "Two or three facts from recruiting operations and total rewards, plus a short new page", "who": ["Talent acquisition operations (interview steps)", "Total rewards (time-off scope)", "Legal review of the time-off wording"], "check": ["Whether candidates ask about time off and interview steps at recruiter screens", "Drop-off between interview stages for experienced roles"]}, {"title": "Put people and current figures behind the weakly supported pillars.", "needs_new_data": true, "steps": ["Collect attributable employee accounts that show the practices at work: an informed captain describing a decision, an engineer on an experiment that did not work, a manager on a keeper-test conversation, a customer service teammate on a typical shift.", "Replace the Q1 2024 audience figure with a current one and say what that scale means for the work of one named role.", "For growth, publish real routes (moves between levels or teams) only where data exists, and describe how feedback actually happens."], "why_first": "It needs new material gathered across the company, so it comes after the two fixes that use what already exists.", "needs": ["Real employee input; no quotes may be drafted on their behalf", "A current audience figure", "Data on internal moves or progression, if it exists", "A description of the feedback practice"], "effort": "large", "effort_note": "New stories gathered from several teams and new figures from people analytics", "who": ["Employer brand team", "Team leads in engineering, customer service and animation", "People analytics (progression data)"], "check": ["Whether interview candidates refer to the stories", "Whether review themes on management and growth shift over the following months"]}], "rewrites": [{"title": "Careers home page, first screen", "original": "Join a star studded ensemble\nWe are making steady progress on our mission to entertain the world\nVIEW OPEN ROLES\nJoin our dream team", "problem": "The first screen gives a mission line and two slogans. Nothing on it is specific to working at Netflix.", "logic": "Uses only facts from the memo and the work life page. Keeps the salaried scope on time off and the role-and-location basis of pay. Leaves out the top-of-market comparison, which the material does not support.", "rewrite": "A team built like a professional sports team, not a family.\nPerformance counts here, not seniority or tenure.\n\nFreedom to use your judgment.\nFor salaried employees there is no prescribed time-off policy. Our expenses policy is five words: “act in Netflix’s best interest.”\n\nPay set for you.\nPay is set for your role and location, with no raise pool. Each year you choose how much of your eligible compensation comes as salary and how much as stock options.\n\nNetflix is not for everyone. Read the culture memo first.\nVIEW OPEN ROLES", "notes": [{"kind": "confirm", "text": "Whether the salary-or-options choice applies in every country where Netflix hires; the work life page names no geography."}, {"kind": "confirm", "text": "Whether the no-prescribed-time-off rule holds for salaried employees in every location; the work life page says time away may be observed differently by location and role."}]}, {"title": "Culture memo, vacation sentence", "original": "Our vacation policy, for example, is two words: “Take vacation.”", "problem": "The sentence names no group, while the work life page limits the rule to salaried employees and two US ads state a different rule for hourly staff.", "logic": "Adds the scope from the work life page and the hourly rule verbatim from the ads, without changing the two-word policy.", "rewrite": "Our vacation policy for salaried employees, for example, is two words: “Take vacation.” Full-time hourly employees accrue 35 days annually for paid time off to be used for vacation, holidays, and sick paid time off.", "notes": [{"kind": "confirm", "text": "Whether the 35-day accrual for full-time hourly employees, stated in two US ads, applies outside the US. If not, add the geography to the second sentence."}]}, {"title": "Customer service role-family page", "original": "From account management, billing inquiries, and tech support to content questions, subscription changes, and any issue that comes up, our teammates around the globe get our members back to where they want to be. And that’s sitting on the edge of their seats, waiting for the next thrill around the corner!", "problem": "The paragraph names the tasks and ends on a slogan. It gives a reader nothing about pay, schedule, location or work mode.", "logic": "Keeps the task list and the global scope, drops the closing slogan, and leaves room for the conditions the page needs. The missing facts are listed below, not written into the copy.", "rewrite": "Customer Service at Netflix\nOur teammates around the globe handle account management, billing inquiries, tech support, content questions, subscription changes and any issue that comes up, and get members back to where they want to be.\nVIEW OPEN ROLES IN CUSTOMER SERVICE", "notes": [{"kind": "evidence", "text": "Pay range or pay logic for customer service roles."}, {"kind": "evidence", "text": "Schedule or shift pattern, locations and work mode."}, {"kind": "evidence", "text": "What a typical shift involves, in a teammate's own words."}, {"kind": "evidence", "text": "Routes people have taken from customer service into other roles, if any."}]}], "questions": [{"kind": "evidence", "for": "communication", "text": "Attributable employee accounts from engineering, customer service and animation that show the memo's practices at work."}, {"kind": "evidence", "for": "communication", "text": "Pay, schedule, locations and work mode for customer service roles."}, {"kind": "evidence", "for": "communication", "text": "Interview steps, typical timing and who the candidate ce is built from standard phrases such as \"great team\" or \"growth opportunities\".</li>\n  <li><b>Specifics.</b> Figures with time frames, named practices, conditions, constraints.</li>\n  <li><b>Can you own it.</b> Whether the claim rests on something the company really has and the material shows.</li>\n</ul>\n<h4 class=\"howto-h\">Labels in the text</h4>\n<ul class=\"howto-list\">\n  <li><span class=\"tag tag-q\">Confirm</span> a likely fact the company needs to confirm. Until then it is not used as a fact.</li>\n  <li><span class=\"tag tag-e\">Information needed</span> the material does not contain it, and the copy cannot be strengthened without it.</li>\n  <li><b>Supported, partly, weakly, not supported</b>: how well a claim is backed inside the material itself. This is not independent fact-checking.</li>\n</ul>\n"};

h += sec('working', T.sec_working, (d.strengths || []).length ? `<div class="cards">${d.strengths.map(x => `<div class="card good"><h3>${esc(x.title)}</h3><p>${txt(x.text)}</p></div>`).join('')}</div>` : '');
// problems
h += sec('problems', T.sec_problems, (d.problems || []).length ? `<div class="cards">${d.problems.map(x => `<div class="card sev-${esc(x.severity)}">
<div class="sev">${esc(T.severity[x.severity] || '')}</div><h3>${esc(x.title)}</h3>
${(x.evidence || []).length ? `<div class="lbl">${esc(T.evidence)}</div>${x.evidence.map(e => `<blockquote>${txt(e)}</blockquote>`).join('')}` : ''}
${x.why ? `<div class="lbl">${esc(T.why_matters)}</div><p>${txt(x.why)}</p>` : ''}
${(x.flags || []).length ? `<div class="lbl">${esc(T.flags)}</div><p class="muted">${x.flags.map(f => esc((T.rf && T.rf[f]) || f)).join(' · ')}</p>` : ''}</div>`).join('')}</div>` : '');
// social media
if ((d.social || []).length) {
h += sec('social', T.sec_social, `<div class="tblwrap"><table><tr>${T.soc_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.social.map(x => `<tr>
<td>${esc(x.platform)}</td><td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.account || x.url)}</a>` : esc(x.account)}</td>
<td>${txt(x.purpose)}</td><td>${txt(x.sample)}</td><td>${txt(x.rhythm)}</td><td>${txt(x.people_share)}</td>
<td>${(x.themes || []).length ? list(x.themes) : ''}${x.notes ? `<p class="muted">${txt(x.notes)}</p>` : ''}</td></tr>`).join('')}</table></div>`);
}
// perception layer (reviews), never part of the score
const pr = d.perception || {};
if ((pr.themes || []).length || (pr.sample || []).length) {
let ph = `<div class="notice">${esc(T.per_note)}${pr.caveat ? ' ' + txt(pr.caveat) : ''}</div>`;
if ((pr.sample || []).length) {
ph += `<h3>${esc(T.per_sample)}</h3><div class="tblwrap"><table><tr>${T.per_sample_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.sample.map(x => `<tr><td>${esc(x.platform)}</td><td>${esc(x.reviews)}</td><td>${esc(x.period)}</td><td>${txt(x.rating)}</td></tr>`).join('')}</table></div>`;
}
if (pr.thin) ph += `<p class="muted">${esc(T.per_thin)}</p>`;
if ((pr.themes || []).length) {
ph += `<div class="tblwrap"><table><tr>${T.per_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.themes.map(x => `<tr>
<td><b>${esc(x.theme)}</b></td><td>${pr.thin || x.mentions == null ? '' : esc(x.mentions) + (x.of ? ' / ' + esc(x.of) : '')}</td>
<td>${chip(T.tone, x.tone)}</td><td>${txt(x.promise)}</td><td>${chip(T.match, x.match)}</td><td>${txt(x.note)}</td></tr>`).join('')}</table></div>`;
}
h += sec('perception', T.sec_perception, ph);
}
// plan
h += sec('plan', T.sec_plan, (d.fixes || []).length ? `<div class="cards fixes">${d.fixes.map(x => `<div class="card fix"><h3>${esc(x.title)}</h3>
<span class="effort ${x.needs_new_data ? 'data' : ''}">${esc(x.needs_new_data ? T.fix_data : T.fix_ready)}</span>
<div class="lbl">${esc(T.fix_where)}</div>${list(x.steps)}
${x.why_first ? `<div class="lbl">${esc(T.fix_why)}</div><p>${txt(x.why_first)}</p>` : ''}
${(x.needs || []).length ? `<div class="lbl">${esc(T.fix_needs)}</div>${list(x.needs)}` : ''}
${x.effort ? `<div class="lbl">${esc(T.effort_lbl)}</div><p>${esc(T.effort[x.effort] || x.effort)}${x.effort_note ? '. ' + txt(x.effort_note) : ''}</p>` : ''}
${(x.who || []).length ? `<div class="lbl">${esc(T.who)}</div><p>${x.who.map(esc).join(', ')}</p>` : ''}
${(x.check || []).length ? `<div class="lbl">${esc(T.check)}</div>${list(x.check)}` : ''}</div>`).join('')}</div>` : '');
// rewrites
h += sec('rewrites', T.sec_rewrites, (d.rewrites || []).length ? `<div class="cards">${d.rewrites.map(x => `<div class="card"><h3>${esc(x.title)}</h3>
${x.problem ? `<div class="lbl">${esc(T.rw_problem)}</div><p>${txt(x.problem)}</p>` : ''}
${x.logic ? `<div class="lbl">${esc(T.rw_logic)}</div><p>${txt(x.logic)}</p>` : ''}
<div class="rw"><div><div class="lbl">${esc(T.rw_original)}</div><div class="before">${txt(x.original)}</div></div>
<div><div class="lbl">${esc(T.rw_rewrite)}</div><div class="after">${txt(x.rewrite)}</div></div></div>
${(x.notes || []).length ? `<ul class="qlist">${x.notes.map(n => `<li><span class="tag ${n.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[n.kind] || n.kind)}</span>${txt(n.text)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>` : '');
// questions
const qs = d.questions || [];
if (qs.length) {
const grp = k => qs.filter(q => (q.for || 'communication') === k);
const qhtml = ['communication', 'audit'].map(k => grp(k).length ? `<h3 style="margin:18px 0 6px">${esc(T.q_for[k])}</h3><ul class="qlist">${grp(k).map(q => `<li><span class="tag ${q.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[q.kind] || q.kind)}</span>${txt(q.text)}</li>`).join('')}</ul>` : '').join('');
h += sec('questions', T.sec_questions, `<p class="muted">${esc(T.q_note)}</p>${qhtml}`);
}
// manual import checklist
if ((d.manual_import || []).length) {
h += sec('manual', T.sec_manual, `<p class="muted">${esc(T.manual_note)}</p><div class="cards">${d.manual_import.map(x => `<div class="card"><h3>${esc(x.platform)}</h3>
${safeUrl(x.url) ? `<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>` : ''}
${(x.capture || []).length ? `<div class="lbl">${esc(T.manual_capture)}</div>${list(x.capture)}` : ''}</div>`).join('')}</div>`);
}
// appendix
let app2 = '';
if ((d.source_map || []).length) {
app2 += `<h3>${esc(T.app_map)}</h3><div class="tblwrap"><table><tr>${T.map_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.source_map.map(x => `<tr>
<td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>` : esc(x.source)}</td><td>${esc(x.kind)}</td>
<td>${chip(T.decision, x.decision)}</td><td>${txt(x.reason)}</td></tr>`).join('')}</table></div>`;
}
if ((d.genericity || []).length) {
app2 += `<h3>${esc(T.app_genericity)}</h3><div class="tblwrap"><table><tr>${T.gen_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.genericity.map(g => `<tr>
<td>${txt(g.claim)}</td><td>${chip(T.gen.verdict, g.verdict)}</td><td>${chip(T.gen.substitution, g.substitution)}</td><td>${chip(T.gen.ubiquity, g.ubiquity)}</td>
<td>${chip(T.gen.specificity, g.specificity)}</td><td>${chip(T.gen.defensibility, g.defensibility)}</td><td>${txt(g.why)}</td></tr>`).join('')}</table></div>`;
}
if ((d.ledger || []).length) {
app2 += `<h3>${esc(T.app_ledger)}</h3><div class="tblwrap"><table><tr>${T.led_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.ledger.map(l => `<tr>
<td>${txt(l.claim)}</td><td>${esc(T.led.class[l.class] || '')}</td><td>${txt(l.evidence)}</td><td>${chip(T.led.strength, l.strength)}</td>
<td>${chip(T.led.status, l.status)}</td><td>${txt(l.comment)}</td></tr>`).join('')}</table></div>`;
}
const det = (d.dimensions || []).flatMap(x => (x.criteria || []).map(c => [x.id, c]));
if (det.length) {
app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
