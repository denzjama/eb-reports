<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

t does not say which countries it covers.", "All seven ads end with the same block about research being big science, including the sales, customer success and support roles.", "The outside view is missing. No review text could be read, and 1 of 15 YouTube videos shows a team at work, with none linking to jobs."], "actions": ["Fix the two contradictions: decide whether the Pre-training degree is required, and drop or explain flexible hours in shift-based ads.", "Link the two workforce reports and the take-home post from the careers page and the AI guidance, with two or three dated figures next to the promise.", "Give commercial and support ads their own closing block, and add pay and country-specific benefits to non-US ads."]}, "dimensions": [{"id": "clarity", "score": 9, "max": 12, "assessable": true, "why": "The careers page opens with a restatable invitation: hard problems with real stakes in making powerful AI go well. What a person gets from working here is spread across seven principles, a benefits list and a hiring section. Some terms such as Ants are not explained.", "criteria": [{"name": "Offer identifiable", "score": 3, "max": 4, "assessable": true, "note": "The headline offer is a mission invitation; the employee side of the exchange has to be pieced together from later sections."}, {"name": "Candidate benefit explicit", "score": 3, "max": 4, "assessable": true, "note": "The benefits and hiring sections speak to you directly with concrete items; the principles section is company description."}, {"name": "Message hierarchy", "score": 2, "max": 2, "assessable": true, "note": "The principles are introduced as guiding how people show up for each other and the mission, so they sit under the headline idea."}, {"name": "Plain language", "score": 1, "max": 2, "assessable": true, "note": "Ants is used without explanation, ASL3 appears on the Fellows page unexplained, and parts of the principles are abstract."}]}, {"id": "differentiation", "score": 10, "max": 16, "assessable": true, "why": "Working with Claude every day is the one core claim that only this employer can make, and it is backed by published internal data. The mission headline and the credentials claim would need only small changes to fit another AI developer, and the high-trust, low-ego line fits anyone.", "criteria": [{"name": "Fits only this employer", "score": 3, "max": 5, "assessable": true, "note": "Of four core claims, only working with Claude every day stops working for another employer; the mission and credentials claims bend and the culture line fits anyone."}, {"name": "Avoids category clichés", "score": 2, "max": 3, "assessable": true, "note": "Lines such as competitive salary, cutting-edge research and roll up your sleeves appear, but specific facts outweigh them."}, {"name": "Uses employer-specific assets", "score": 3, "max": 4, "assessable": true, "note": "Claude, equity donation matching, engineer authorship and the open take-home challenge are used; the governance structure is not linked to the employee experience."}, {"name": "Hard to copy honestly", "score": 1, "max": 2, "assessable": true, "note": "Only the working-with-Claude promise rests on something structural; the mission and culture claims could be made by others."}, {"name": "Memorable idea", "score": 1, "max": 2, "assessable": true, "note": "The beat-Claude take-home challenge is memorable and about the work but appears in one post; repeated lines are about the mission and the model."}]}, {"id": "proof", "score": 10, "max": 16, "assessable": true, "why": "Five of eight promises have meaningful support, and one of them strongly. Two promises are contradicted by job ads and the culture claim has only weak support. The strongest proof sits in research reports, away from the promises it supports.", "criteria": [{"name": "Share of claims with proof", "score": 3, "max": 6, "assessable": true, "note": "Core claims: working with Claude strongly supported, mission partly, culture weakly, credentials contradicted. Supporting: three partly supported, one contradicted."}, {"name": "Specific evidence", "score": 3, "max": 4, "assessable": true, "note": "More than half the promises have support, a mix of dated survey data and stated practices."}, {"name": "Evidence matches the claim", "score": 2, "max": 3, "assessable": true, "note": "Four of the five supported promises are supported only for part of their scope, such as research roles or new regional teams."}, {"name": "Proof next to the claim", "score": 2, "max": 3, "assessable": true, "note": "Benefits and engineer authorship sit next to their promises; the Claude data and the business-team evidence sit in other documents."}]}, {"id": "audience_fit", "score": 10, "max": 12, "assessable": true, "why": "The careers page speaks separately to technical and non-technical candidates and each ad describes its role in detail. The shared closing block in every ad is written for researchers. Trade-offs are stated openly.", "criteria": [{"name": "Clear audience", "score": 3, "max": 3, "assessable": true, "note": "Role families, technical and non-technical tracks, and the Fellows audience are named."}, {"name": "Addresses the audience's decision factors", "score": 3, "max": 4, "assessable": true, "note": "Pay, office policy, visas, interview format and concrete problems are covered for US roles; pay is missing in two non-US ads."}, {"name": "Adapted for different audiences", "score": 2, "max": 3, "assessable": true, "note": "Role content is adapted, but sales, customer success and support ads close with the same research-centred block."}, {"name": "Makes real choices", "score": 2, "max": 2, "assessable": true, "note": "Stated choices include no internships, no interview feedback, at least 25% office time and going above and beyond as the expected standard."}]}, {"id": "employee_truth", "score": 10, "max": 10, "assessable": true, "why": "The two workforce reports quote employees by role on concrete changes to their work, including skill loss, fewer questions from junior colleagues and career uncertainty. The take-home post is a named engineer's first-hand account. None of this is placed on the careers page.", "criteria": [{"name": "Employee voice", "score": 3, "max": 3, "assessable": true, "note": "A named performance-optimization lead and many role-identified employees describe concrete experiences in their own words."}, {"name": "Work reality", "score": 3, "max": 3, "assessable": true, "note": "Ads list sample projects, team options and shift hours; the reports describe how work with Claude agents runs day to day."}, {"name": "Names difficulties", "score": 2, "max": 2, "assessable": true, "note": "The reports name skill atrophy, less mentoring contact and pressure to move fast; the Sydney ad calls foundation work unglamorous."}, {"name": "Culture shown through practice", "score": 2, "max": 2, "assessable": true, "note": "Practices are shown: decisions debated in written Slack threads, internal redeployment, and Claude kept out of hiring decisions."}]}, {"id": "consistency", "score": 8, "max": 12, "assessable": true, "why": "The mission and the working-with-Claude idea run through every touchpoint and the voice is recognisably the same. Two direct contradictions between the careers page and the ads pull the score down.", "criteria": [{"name": "One core promise across touchpoints", "score": 4, "max": 5, "assessable": true, "note": "Every ad repeats the mission and every application form asks about AI use; the YouTube channel carries the mission only through product stories."}, {"name": "Proof tells the same story", "score": 2, "max": 3, "assessable": true, "note": "The workforce reports support the Claude promise, but the 2026 report's data on fewer junior technical hires sits awkwardly beside the credentials-light message."}, {"name": "Same voice", "score": 2, "max": 2, "assessable": true, "note": "Direct, first-person-plural tone across the careers page, guidance, ads and posts."}, {"name": "No contradictions", "score": 0, "max": 2, "assessable": true, "note": "Degree requirement and flexible hours both contradict other touchpoints."}]}, {"id": "candidate_relevance", "score": 10, "max": 12, "assessable": true, "why": "The ads let a candidate picture the job, and the FAQ answers doubts directly. The reason to join is mostly the mission, and decision facts are incomplete outside the US.", "criteria": [{"name": "Why join", "score": 2, "max": 3, "assessable": true, "note": "The main reason given is the mission; employee-side reasons such as equity donation matching sit lower on the page."}, {"name": "Picture the role", "score": 3, "max": 3, "assessable": true, "note": "Responsibilities, sample projects, team options and in Sydney the working hours are concrete."}, {"name": "Decision facts", "score": 2, "max": 3, "assessable": true, "note": "Pay is given in five of seven ads; Tokyo and Sydney show none, and years of experience are tied to undisclosed internal levels."}, {"name": "Answers doubts", "score": 3, "max": 3, "assessable": true, "note": "The FAQ covers internships, feedback, re-applying, offer decision time, visas and remote work; ads invite people who do not meet every qualification."}]}, {"id": "conversion", "score": 9, "max": 10, "assessable": true, "why": "Every page leads to open roles or an application form, and pay and logistics sit right above the form. Required essays and a US arbitration agreement add effort, and the steps after applying are not laid out.", "criteria": [{"name": "Next step clear", "score": 3, "max": 3, "assessable": true, "note": "Explore open roles on the careers page and an application form on each ad."}, {"name": "Facts near the apply button", "score": 2, "max": 2, "assessable": true, "note": "Pay, office policy and visa information sit directly above the form."}, {"name": "Effort reduced or explained", "score": 1, "max": 2, "assessable": true, "note": "A LinkedIn profile can replace a resume, but forms add a required 200 to 400 word answer and, in US ads, an arbitration agreement."}, {"name": "Call to action fits the reader", "score": 2, "max": 2, "assessable": true, "note": "Job alerts for those not ready, the Fellows route for people moving into safety research, and an email route for anyone who beats Claude on the open take-home."}, {"name": "Process explained", "score": 1, "max": 1, "assessable": true, "note": "Interview format and tools are described; the number of stages and timing are not."}]}], "strengths": [{"title": "A promise only Anthropic can make, with data behind it", "text": "The AI guidance says Anthropic uses Claude every day and looks for people who collaborate well with AI. Your December 2025 report shows the 132 engineers and researchers surveyed in August 2025 self-reporting Claude use in 59% of their work. The October 2026 report says that by August, agents in employee-directed sessions worked six times as many hours as the people directing them. Two reports a year apart make this a current practice, not a one-off."}, {"title": "Candid employee voice that names downsides", "text": "The workforce reports quote employees on what got worse as well as better: some worry about skills atrophying, a senior engineer says junior colleagues come with questions less often, and one employee describes coming to work to put themselves out of a job. The reports also list their own limits, such as non-anonymous responses."}, {"title": "Hiring rules stated plainly", "text": "The AI guidance says when Claude is allowed at each stage and how Anthropic uses Claude in hiring, and states that Claude does not make hiring decisions and candidate data is not used for training. The FAQ says there is no feedback on applications, re-applying is possible after 12 months, and candidates can take their time on an offer."}, {"title": "Pay and benefits in figures", "text": "Five of seven ads give an annual range and explain that sales ranges are on-target earnings. The careers page lists 22 weeks of paid parental leave, a $500 a month wellness and time-saver stipend, and 1:1 equity donation matching up to 25% of the equity grant."}, {"title": "A credentials-light route with outcomes", "text": "The Fellows page says more than 200 fellows have taken part since early 2025, over 65% have published work from their fellowship, and over 35% from past cohorts joined Anthropic full-time. It says a PhD, prior ML experience or published papers are not needed."}], "problems": [{"severity": "high", "title": "Two promises on the careers page are contradicted by the job ads.", "evidence": ["Careers page: \"We care about what you can do, not where you learned to do it.\"", "Pre-training ad, Qualifications: \"Advanced degree (MS or PhD) in Computer Science, Machine Learning, or a related field\"", "The same ad's Logistics section gives the minimum education as a Bachelor's degree or an equivalent combination of education, training and experience.", "All seven ads: \"We offer competitive compensation and benefits, optional equity donation matching, generous vacation and parental leave, flexible working hours, and a lovely office space in which to collaborate with colleagues.\"", "Sydney ad: \"Note: Specialists in Sydney will work 12pm to 8pm, Monday to Friday.\" The ad also includes on-call pager duty during APAC hours."], "why": "The credentials promise is one of four core claims and has otherwise good support. A flagship research ad that lists an advanced degree, with a lower minimum further down the same page, leaves the actual requirement unclear. The flexible-hours line sits in an ad that fixes the hours.", "flags": ["RF12"]}, {"severity": "medium", "title": "The strongest proof is kept away from the careers path, while the culture section relies on principle statements.", "evidence": ["Careers page principle: \"Anthropic is a high-trust, low-ego organization.\" No example of how this works sits next to it.", "The workforce reports and the take-home post are not linked from the captured careers page text or from the seven ads.", "The 2026 report describes decisions debated in written Slack threads and quotes a researcher saying leaders have to defend feedback in the open."], "why": "The careers page carries promises; the evidence for them sits in research posts a candidate has to find separately. The culture claim has only one weak supporting passage in the material, and it is in a report, not beside the principle.", "flags": ["RF21", "RF06"]}, {"severity": "medium", "title": "Sales, customer success and support ads close with a block written for researchers.", "evidence": ["All seven ads, under How we're different: \"We believe that the highest-impact AI research will be big science.\"", "The same block invites readers to understand the research directions by reading recent research, in the Dublin sales, London customer success and Sydney support ads too."], "why": "The role content in these ads is well adapted, but their only section on what makes Anthropic different talks about research teams. The careers page already says non-technical teams are small and shape how the company works; that idea does not reach these ads.", "flags": ["RF09"]}, {"severity": "medium", "title": "Decision facts are thinner for roles outside the US.", "evidence": ["The Tokyo Applied AI Architect and Sydney Product Support ads show no pay range; the other five ads do.", "The careers page benefits list gives figures such as 22 weeks of paid parental leave without saying which countries it covers. Non-US ads mention generous vacation and parental leave without figures."], "why": "A candidate in Tokyo or Sydney cannot assess the reward side of the offer from the ad, and cannot tell whether the benefit figures on the careers page apply to them.", "flags": []}, {"severity": "medium", "title": "The careers page does not say who is being hired now, while your own report documents a shift away from junior technical hiring.", "evidence": ["Careers page: about half of technical staff had no prior ML experience, and plenty never went to college.", "Take-home post: several of the highest-performing performance engineers came directly from undergrad.", "2026 report: the share of junior technical hires fell from 27% to 9%, and by April 2026 engineering and research teams had deemphasized hiring for lower band technical positions."], "why": "The careers page and the take-home post describe past and current staff; the 2026 report describes current hiring. The careers page gives no signal about level, and job ads tie years of experience to internal levels that are not shown.", "flags": []}, {"severity": "low", "title": "The public social channel read carries almost no people or hiring content.", "evidence": ["1 of 15 YouTube videos shows a team at work (the molecular biology lab); none of the 15 descriptions link to jobs or the careers page.", "X and LinkedIn, both linked from the careers page, could not be read."], "why": "On the evidence available, social media does not carry the employer story. This judgement covers YouTube only until X and LinkedIn are added.", "flags": []}], "fixes": [{"title": "Resolve the degree and flexible-hours contradictions in the ads.", "needs_new_data": true, "steps": ["In the Pre-training ad, decide whether an MS or PhD is required. If not, move it to Preferred Experience so it matches the Logistics minimum and the careers page.", "In shift-based ads such as Sydney support, remove flexible working hours from the closing sentence or explain what flexibility exists within the stated hours.", "Check other ads built on the same template for the same two issues."], "why_first": "These touch a core promise and are visible to every applicant who reads the full ad. The fix is mostly editing.", "needs": ["Whether the advanced degree is a real requirement for the Pre-training role", "What flexibility, if any, shift-based roles have"], "effort": "small", "effort_note": "Two decisions and edits to a shared ad template.", "who": ["Research recruiting and the Pre-training hiring manager", "The APAC support lead", "Whoever owns the job-ad template"], "check": ["Whether candidates without an advanced degree ask if they can apply for research roles", "Whether shift candidates raise working-hours questions at the first call"]}, {"title": "Put the workforce evidence next to the promises it supports.", "needs_new_data": false, "steps": ["On the careers page and in the AI guidance, add a short section on how work with Claude looks, with two or three dated figures from the two reports and links to them.", "Link the take-home post from How we hire for engineering candidates.", "Under the principles, add one practice per principle where the reports already describe one, such as decisions debated in written Slack threads."], "why_first": "The evidence already exists and is published, so this lifts proof without gathering anything new.", "needs": ["Agreement from the report authors on which figures to reuse"], "effort": "medium", "effort_note": "New careers-page copy drawing on published reports, plus review by the authors.", "who": ["Employer brand or careers-site owner", "The Societal Impacts and Economics report authors", "Engineering recruiting"], "check": ["Clicks from the careers page to the reports", "Whether candidates refer to the reports in their Why Anthropic answers"]}, {"title": "Give each role family its own closing block and complete non-US decision facts.", "needs_new_data": true, "steps": ["Write a How we're different block for go-to-market and support ads, built on the careers-page idea that non-technical teams are small and shape how the company works, with the founding-team details these ads already contain.", "Add pay ranges to ads where they are missing, starting with Tokyo and Sydney.", "State on the careers page which benefits apply in which countries."], "why_first": "It needs input from several teams and countries, so it follows the two fixes that use existing material.", "needs": ["Pay ranges for Tokyo and Sydney", "Benefits by country", "One or two concrete facts per role family about how its teams work"], "effort": "large", "effort_note": "New copy per role family plus compensation and benefits data by country.", "who": ["Go-to-market and support leaders", "Compensation and benefits", "Regional recruiters"], "check": ["Application numbers and quality for the Tokyo and Sydney roles after the change", "Whether non-US candidates ask about benefits at offer stage"]}], "rewrites": [{"title": "Closing sentence in the Sydney Product Support ad", "original": "Anthropic is a public benefit corporation headquartered in San Francisco. We offer competitive compensation and benefits, optional equity donation matching, generous vacation and parental leave, flexible working hours, and a lovely office space in which to collaborate with colleagues.", "problem": "Promises flexible working hours in an ad that sets the hours and adds on-call duty. Competitive compensation stands in for a pay range the ad does not give.", "logic": "Restates the hours from the same ad next to the offer, keeps the benefits the ad already names, and removes the two lines the ad cannot back.", "rewrite": "Anthropic is a public benefit corporation headquartered in San Francisco. In this role you work 12pm to 8pm, Monday to Friday, and take part in on-call pager duty during APAC hours. We offer optional equity donation matching, generous vacation and parental leave, and an office space in which to collaborate with colleagues.", "notes": [{"kind": "evidence", "text": "The annual pay range for this role in Sydney, to replace competitive compensation."}, {"kind": "confirm", "text": "Whether any flexibility exists within the Sydney shift. If it does, describe it instead of removing it."}]}, {"title": "Degree line in the Pre-training ad (if the degree is not required)", "original": "Advanced degree (MS or PhD) in Computer Science, Machine Learning, or a related field", "problem": "Listed as a qualification, it contradicts the careers page and the Bachelor's-or-equivalent minimum in the same ad.", "logic": "Keeps the wording but moves it under Preferred Experience, so the ad says the same thing as the careers page. Apply only if the degree is not a real requirement.", "rewrite": "Preferred Experience: Advanced degree (MS or PhD) in Computer Science, Machine Learning, or a related field", "notes": [{"kind": "confirm", "text": "Whether an MS or PhD is required for the Pre-training role. If it is, change the careers page and the Logistics line instead."}]}, {"title": "Opening of the AI guidance for candidates", "original": "At Anthropic, we use Claude every day, so we’re looking for candidates who excel at collaborating with AI.", "problem": "The strongest promise in the material stands alone; its evidence sits in two reports the page does not link.", "logic": "Adds one dated figure from the report and names the downsides that the same report records, so the promise and its proof sit together.", "rewrite": "At Anthropic, we use Claude every day, so we’re looking for candidates who excel at collaborating with AI. In August 2025, the 132 engineers and researchers we surveyed self-reported using Claude in 59% of their work. Our research on our own workforce also records what some people find harder: less hands-on practice, fewer questions from junior colleagues, and uncertainty about where their careers are going. Read How AI is transforming work at Anthropic and How employment is changing at Anthropic.", "notes": [{"kind": "confirm", "text": "Whether the AI guidance, last updated Jul 10, 2025, is still current before republishing it."}]}], "questions": [{"kind": "confirm", "for": "communication", "text": "Is an MS or PhD required for the Pre-training Research Engineer/Scientist role, or is it preferred?"}, {"kind": "confirm", "for": "communication", "text": "What does flexible working hours mean for shift-based roles such as Sydney product support?"}, {"kind": "confirm", "for": "communication", "text": "Which of the benefits on the careers page apply in the UK, Ireland, Japan, Australia and other countries?"}, {"kind": "evidence", "for": "communication", "text": "Annual pay ranges for the Tokyo Applied AI Architect and Sydney Product Support roles."}, {"kind": "confirm", "for": "communication", "text": "Is the AI guidance for candidates, last updated Jul 10, 2025, still current?"}, {"kind": "confirm", "for": "communication", "text": "Which levels are technical teams hiring at now, so the careers page can say so?"}, {"kind": "evidence", "for": "communication", "text": "Examples of how each principle, such as high-trust and low-ego, shows up in day-to-day decisions."}, {"kind": "evidence", "for": "communication", "text": "How engineers influence Anthropic's direction, to support the line that they have as much input as anyone else."}, {"kind": "confirm", "for": "communication", "text": "Are the Fellows page dates (January cohort, apply by October 18) current, and which year do they refer to?"}, {"kind": "evidence", "for": "audit", "text": "Screenshots of recent reviews from Glassdoor, Blind and Indeed, to build the perception layer."}, {"kind": "evidence", "for": "audit", "text": "Screenshots of recent X and LinkedIn posts, including the LinkedIn Life tab, to assess social media fully."}], "genericity": [{"claim": "Shape how AI meets the world: researchers, engineers and builders working to make sure powerful AI goes well for everyone (careers page headline).", "verdict": "partial", "substitution": "bends", "ubiquity": "common", "specificity": "some", "defensibility": "supportable", "why": "The wording could be reused by another AI developer with small changes. It is tied to this employer by Claude, the helpful-honest-harmless framing and, on the company page, the public benefit corporation and Long-Term Benefit Trust. Shape how AI meets the world follows the lexicon pattern ${(x.check || []).length ? `<div class="lbl">${esc(T.check)}</div>${list(x.check)}` : ''}</div>`).join('')}</div>` : '');
// rewrites
h += sec('rewrites', T.sec_rewrites, (d.rewrites || []).length ? `<div class="cards">${d.rewrites.map(x => `<div class="card"><h3>${esc(x.title)}</h3>
${x.problem ? `<div class="lbl">${esc(T.rw_problem)}</div><p>${txt(x.problem)}</p>` : ''}
${x.logic ? `<div class="lbl">${esc(T.rw_logic)}</div><p>${txt(x.logic)}</p>` : ''}
<div class="rw"><div><div class="lbl">${esc(T.rw_original)}</div><div class="before">${txt(x.original)}</div></div>
<div><div class="lbl">${esc(T.rw_rewrite)}</div><div class="after">${txt(x.rewrite)}</div></div></div>
${(x.notes || []).length ? `<ul class="qlist">${x.notes.map(n => `<li><span class="tag ${n.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[n.kind] || n.kind)}</span>${txt(n.text)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>` : '');
// questions
const qs = d.questions || [];
if (qs.length) {
const grp = k => qs.filter(q => (q.for || 'communication') === k);
const qhtml = ['communication', 'audit'].map(k => grp(k).length ? `<h3 style="margin:18px 0 6px">${esc(T.q_for[k])}</h3><ul class="qlist">${grp(k).map(q => `<li><span class="tag ${q.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[q.kind] || q.kind)}</span>${txt(q.text)}</li>`).join('')}</ul>` : '').join('');
h += sec('questions', T.sec_questions, `<p class="muted">${esc(T.q_note)}</p>${qhtml}`);
}
// manual import checklist
if ((d.manual_import || []).length) {
h += sec('manual', T.sec_manual, `<p class="muted">${esc(T.manual_note)}</p><div class="cards">${d.manual_import.map(x => `<div class="card"><h3>${esc(x.platform)}</h3>
${safeUrl(x.url) ? `<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>` : ''}
${(x.capture || []).length ? `<div class="lbl">${esc(T.manual_capture)}</div>${list(x.capture)}` : ''}</div>`).join('')}</div>`);
}
// appendix
let app2 = '';
if ((d.source_map || []).length) {
app2 += `<h3>${esc(T.app_map)}</h3><div class="tblwrap"><table><tr>${T.map_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.source_map.map(x => `<tr>
<td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>` : esc(x.source)}</td><td>${esc(x.kind)}</td>
<td>${chip(T.decision, x.decision)}</td><td>${txt(x.reason)}</td></tr>`).join('')}</table></div>`;
}
if ((d.genericity || []).length) {
app2 += `<h3>${esc(T.app_genericity)}</h3><div class="tblwrap"><table><tr>${T.gen_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.genericity.map(g => `<tr>
<td>${txt(g.claim)}</td><td>${chip(T.gen.verdict, g.verdict)}</td><td>${chip(T.gen.substitution, g.substitution)}</td><td>${chip(T.gen.ubiquity, g.ubiquity)}</td>
<td>${chip(T.gen.specificity, g.specificity)}</td><td>${chip(T.gen.defensibility, g.defensibility)}</td><td>${txt(g.why)}</td></tr>`).join('')}</table></div>`;
}
if ((d.ledger || []).length) {
app2 += `<h3>${esc(T.app_ledger)}</h3><div class="tblwrap"><table><tr>${T.led_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.ledger.map(l => `<tr>
<td>${txt(l.claim)}</td><td>${esc(T.led.class[l.class] || '')}</td><td>${txt(l.evidence)}</td><td>${chip(T.led.strength, l.strength)}</td>
<td>${chip(T.led.status, l.status)}</td><td>${txt(l.comment)}</td></tr>`).join('')}</table></div>`;
}
const det = (d.dimensions || []).flatMap(x => (x.criteria || []).map(c => [x.id, c]));
if (det.length) {
app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
