<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

ity", "mentions": 1, "of": 73, "tone": "positive", "promise": "\"Join us. Be you.\" and the Diversity Network Associations", "match": "not_addressed", "note": "The theme your careers pages put first appears in one answer."}], "caveat": "Only one review platform could be read; Glassdoor, Indeed and kununu blocked automated access. The 73 answers are short, undated replies to the platform's own questions. About half of those questions ask what is good and half what should change, so tone partly follows the question. Several answers are off-topic or unclear."}, "manual_import": [{"platform": "LinkedIn", "url": "https://www.linkedin.com/company/apple", "capture": ["Page header with description and follower count, to check the page is official", "The latest 9 to 12 posts", "3 to 5 posts about people, work or hiring, opened with captions", "Pinned posts", "The Life tab sections", "The Jobs tab"]}, {"platform": "Glassdoor", "url": "https://www.glassdoor.com/Reviews/Apple-Reviews-E1138.htm", "capture": ["Rating page with review count and date", "15 to 30 recent reviews with dates, without author names"]}, {"platform": "Indeed", "url": "https://www.indeed.com/cmp/Apple/reviews", "capture": ["Rating page with review count and date", "15 to 30 recent reviews with dates, without author names"]}, {"platform": "kununu", "url": "https://www.kununu.com/us/apple", "capture": ["Rating page with review count and date", "15 to 30 recent reviews with dates, without author names"]}], "scope": {"reviewed": ["Apple's US careers site: main page, Life at Apple, benefits, shared values, retail, students, the Diversity Network Associations page and two team pages (Support and Service, Software and Services)", "Twelve employee stories: Carissa, Tom, Serene and Arlinda (retail page), Desireh and Quincy (students page), Nafisah (story page), and iLian, Jay, Georgiana, Tetsu and Bianca (networks page)", "Excerpts of 40 current US job listings: the newest 20 of 600+ and 20 of the 32 AppleCare listings", "Apple's YouTube channel (latest 15 videos) and 73 employee answers on Comparably, reported separately and not scored"], "not_reviewed": ["Full job ad texts: individual ad pages could not be read, so pay ranges and full requirements were not seen", "A hiring-process or FAQ page: none was found in the pages reviewed", "Seven other team pages, the locations and accessibility pages, and careers sites for other countries", "LinkedIn, Glassdoor, Indeed and kununu: closed to automatic collection (see What to add for the full picture)", "The interview process itself, offer communications and what employees say in private channels"]}, "summary": {"points": ["The headlines a candidate meets first (\"Join us. Be you.\", \"you'll add something\", \"We count on you.\") would read the same under any employer's name. The Apple-specific facts sit one or two clicks deeper: the products each team builds, the employee-led networks founded in 1986 with 60,000+ members, stock-grant eligibility for every employee, store roles for students that need no tech experience.", "Proof is better than the headlines suggest. Six of eight promises have at least partial support, mostly from the networks page, the benefits page and twelve attributable stories. None has numbered evidence such as promotion rates or pay-equity results, and the inclusion proof sits on a different page from the promise.", "Two decision facts are missing or wrong. No page or listing excerpt reviewed shows pay. The seasonal, part-time Specialist listing shows 40 weekly hours, while a Genius listing shows 20.", "Retail and student candidates are served best: role descriptions, part-time options, training and entry stories. The engineering and support team pages list products and technologies but carry no employee voice and none of the core promises.", "Outside view (not scored): in 73 Comparably answers, colleagues are mostly praised and management mostly criticised. Hiring and interviews come up in 11 answers, a topic the careers pages reviewed do not cover. Inclusion, your lead theme, appears in one. No careers-specific social account could be verified, and the main YouTube channel had no people content."], "actions": ["Rewrite the first screen of the main careers page and Life at Apple around Apple-specific facts you already publish.", "Add pay to every job ad and correct the hours field, starting with the seasonal part-time Specialist listing.", "Publish a hiring-process page for retail, corporate and student roles, and link it from every listing."]}, "dimensions": [{"id": "clarity", "score": 7, "max": 12, "assessable": true, "why": "The main page opens with \"Join us. Be you.\" and a promise that you will add something, but the offer then splits into impact, community, growth, values and benefits with no clear lead. The benefits and retail pages speak to the candidate directly and concretely. The opening copy uses abstract phrasing, and some job ads use unexplained acronyms.", "criteria": [{"name": "Employer proposition identifiable", "score": 2, "max": 4, "assessable": true, "note": "An offer can be pieced together (be yourself, contribute, grow, be looked after), but it competes with several ideas on the first screen."}, {"name": "Candidate benefit explicit", "score": 3, "max": 4, "assessable": true, "note": "Benefits, retail and student pages say what you get and do; the main page's values block and the team pages describe the company."}, {"name": "Message hierarchy", "score": 1, "max": 2, "assessable": true, "note": "\"The whole you\" recurs on Life at Apple and benefits, but the main page gives equal weight to five or more ideas."}, {"name": "Accessibility of language", "score": 1, "max": 2, "assessable": true, "note": "Mostly plain; abstract opening copy and unexplained acronyms such as ACE in a job ad slow reading."}]}, {"id": "differentiation", "score": 9, "max": 16, "assessable": true, "why": "None of the five core promises becomes untrue if another employer's name is swapped in. Apple-specific content exists in secondary material: team pages name the apps and technologies, the networks page gives founding year and membership, the benefits page names stock-grant eligibility for all. That content is not used as the basis of the headline offer.", "criteria": [{"name": "Resistance to name substitution", "score": 2, "max": 5, "assessable": true, "note": "All five core promises fit any employer unchanged; specific detail appears only in secondary pages."}, {"name": "Resistance to category clichés", "score": 2, "max": 3, "assessable": true, "note": "Stock phrases (make an impact, collaborative culture, fast-paced, world-class) are present but outweighed by specific team, benefits and network detail."}, {"name": "Employer-specific advantages", "score": 3, "max": 4, "assessable": true, "note": "Named products and teams, Apple Store roles, Apple University, the networks and stock for all are used, but not connected to the headline offer."}, {"name": "Defensibility", "score": 1, "max": 2, "assessable": true, "note": "The headlines rest on nothing structural; the network history and product work could anchor them but are not used that way."}, {"name": "Memorability", "score": 1, "max": 2, "assessable": true, "note": "\"Join us. Be you.\" is memorable but says nothing about the work."}]}, {"id": "proof", "score": 10, "max": 16, "assessable": true, "why": "Six of eight promises have partial support and two have weak support; none has strong support. The best evidence is the networks page (membership figures and outcomes) and the benefits detail. Most support is a practice or a single person's story rather than a number with scope, and the inclusion proof sits on a different page from the promise.", "criteria": [{"name": "Claim evidence coverage", "score": 4, "max": 6, "assessable": true, "note": "Three of five core promises (belonging, growth, care through benefits) and all three supporting promises are partly supported; contribution and shared values are weakly supported."}, {"name": "Evidence specificity", "score": 2, "max": 4, "assessable": true, "note": "Support is mostly moderate: practices and stories without rates or outcomes."}, {"name": "Evidence relevance", "score": 2, "max": 3, "assessable": true, "note": "Evidence covers narrower groups than the promises, for example network members or one story per path."}, {"name": "Claim and evidence proximity", "score": 2, "max": 3, "assessable": true, "note": "Benefits, equal-pay and part-time evidence sits beside the promise; inclusion and growth evidence sits on other pages."}]}, {"id": "audience_fit", "score": 9, "max": 12, "assessable": true, "why": "Separate pages address retail, students and named teams, and the retail page sets out roles, part-time options and training. Engineering and support pages adapt the description of the work but not the promise or proof. Few choices are made that would put anyone off.", "criteria": [{"name": "Audience definition", "score": 3, "max": 3, "assessable": true, "note": "Retail roles, students and teams are named explicitly."}, {"name": "Motivation relevance", "score": 3, "max": 4, "assessable": true, "note": "Part-time options, training and benefits for retail; technologies for engineers. Pay is absent and engineers get no detail on how teams work."}, {"name": "Segmentation", "score": 2, "max": 3, "assessable": true, "note": "Retail and students are well served; team pages carry none of the shared core."}, {"name": "Trade-offs", "score": 1, "max": 2, "assessable": true, "note": "Only implied: a fast-paced environment for Genius, hands-on for Manager."}]}, {"id": "employee_truth", "score": 8, "max": 10, "assessable": true, "why": "Twelve attributable employees describe concrete events in their own words: Jay's training that over 6,000 people joined, Carissa's move from part-time Specialist to Senior Manager, Nafisah starting as a manager with no retail or tech experience. Difficulty is only hinted at.", "criteria": [{"name": "Employee voice", "score": 3, "max": 3, "assessable": true, "note": "Named employees with role and location, specific events and their own words."}, {"name": "Work reality", "score": 2, "max": 3, "assessable": true, "note": "Retail tasks and team technologies are listed; schedules, team set-up and a typical week are not."}, {"name": "Tensions and trade-offs", "score": 1, "max": 2, "assessable": true, "note": "Hints only: Nafisah found it a little intimidating, Quincy's Advisor role was fast-paced, Jay says people are busy."}, {"name": "Behaviour over adjectives", "score": 2, "max": 2, "assessable": true, "note": "Culture shown through practices: member-led networks with advisors, Juneteenth made an Apple holiday after a network request, no salary-history question."}]}, {"id": "consistency", "score": 8, "max": 12, "assessable": true, "why": "The whole-person and inclusion theme runs through the main page, Life at Apple, benefits, the networks page and the retail job ad openers, and the voice is recognisably the same. Team pages and many corporate ad openers drift to product and impact language. One listing's hours contradict its title.", "criteria": [{"name": "Core promise alignment", "score": 3, "max": 5, "assessable": true, "note": "Most proposition pages align; team pages and corporate ad openers do not carry the promise."}, {"name": "Proof alignment", "score": 2, "max": 3, "assessable": true, "note": "Network and story proof supports belonging and growth; the main page's company commitments (net-zero, privacy) are off the employee story."}, {"name": "Tone and message coherence", "score": 2, "max": 2, "assessable": true, "note": "Same warm, second-person voice across pages and ads."}, {"name": "No contradictions", "score": 1, "max": 2, "assessable": true, "note": "The seasonal, part-time Specialist listing shows 40 weekly hours."}]}, {"id": "candidate_relevance", "score": 8, "max": 12, "assessable": true, "why": "Hours, locations, part-time options, benefits and internship eligibility are stated. Pay does not appear in any page or listing excerpt reviewed. Some likely doubts are answered (no tech experience needed, any degree, English for corporate roles), and the reasons to join stay general.", "criteria": [{"name": "Why join", "score": 2, "max": 3, "assessable": true, "note": "Reasons are given (be yourself, grow, benefits) but are general."}, {"name": "Work and role reality", "score": 2, "max": 3, "assessable": true, "note": "Retail roles say what you will do; full job ads could not be read."}, {"name": "Decision facts", "score": 2, "max": 3, "assessable": true, "note": "Hours, location and benefits present; pay missing from all material read."}, {"name": "Candidate questions and doubts", "score": 2, "max": 3, "assessable": true, "note": "No tech experience needed, training provided, any degree, English for most corporate roles."}]}, {"id": "conversion", "score": 8, "max": 9, "assessable": true, "why": "Every page ends in a specific next step: role-specific search buttons, Submit Resume on listings, and a profile option for undecided candidates. Effort and what happens after applying are not described in the pages reviewed; the hiring process could not be assessed because no process page was found.", "criteria": [{"name": "Next-step clarity", "score": 3, "max": 3, "assessable": true, "note": "Role-specific buttons such as Find available Specialist roles, and Submit Resume on each listing."}, {"name": "Decision support near the button", "score": 2, "max": 2, "assessable": true, "note": "Role descriptions, hours and benefits sit next to the buttons."}, {"name": "Reduced effort", "score": 1, "max": 2, "assessable": true, "note": "The profile option and no-experience notes help; time to apply and documents needed are not stated."}, {"name": "Fit of the call to action", "score": 2, "max": 2, "assessable": true, "note": "Separate actions for ready applicants (search roles) and undecided ones (complete your profile)."}, {"name": "Process transparency", "score": 0, "max": 1, "assessable": false, "note": "Not assessed: no hiring-process page was found and full job ads could not be read."}]}], "strengths": [{"title": "The networks page proves the inclusion promise with figures and outcomes", "text": "The Diversity Network Associations page gives a founding year (1986), 81+ chapters and 60,000+ members worldwide, explains that each network is led by its members with support from Community Advisors, and that any employee can join any network. Its stories report outcomes: over 6,000 people joined Jay's bystander-intervention training, and after a Black@Apple request Juneteenth became an official Apple holiday."}, {"title": "Benefits are stated as specific practices", "text": "The benefits page names stock-grant eligibility and a stock discount for all employees, 401(k) matching, a gradual return-to-work programme for new parents, one-for-one donation matching and $25 per volunteer hour up to $10,000 a year, and a commitment not to ask about salary history. The retail page extends benefits to part-time staff and product discounts to seasonal hires. A footnote states that programmes vary by country and eligibility."}, {"title": "Retail and student pages answer the entry questions", "text": "The students page says Apple Store roles need no tech experience and come with training; the Support College Advisor section says the same. Stories back this: Nafisah started as a store manager with no retail or tech experience, Arlinda came in with no tech experience while looking for stable part-time work, and Serene's schedule worked around her course load."}, {"title": "Growth is shown through real paths", "text": "Carissa moved from part-time Specialist into management and now works as a Senior Manager. Quincy went from Support College Advisor to an analyst role in Information Systems and Technology. Bianca became an engineering manager after leading Women@Apple. Life at Apple names Apple e a difference in the lives of our customers.\"", "Software and Services page: \"Responsible for the world’s most popular camera and the Photos app, focusing on all aspects — including image capture and display, and the user interface.\"", "Site Reliability Engineer listing: \"Supporting 2.5 billion active Apple devices, processing billions of secure transactions, and keeping the technology that defines modern life running flawlessly, IS&T makes the impossible feel effortless.\"", "Main careers page values block: \"We’re committed to bringing net emissions to zero across our entire carbon footprint by 2030.\""], "why": "No comparison in the material backs \"the world's most\" claims. The device count and the emissions commitment are company facts with no statement of what they mean for the person in the role. The benefits page opens with the superlative instead of its own specific benefits.", "flags": ["RF02", "RF22"]}, {"severity": "medium", "title": "A part-time listing shows full-time hours", "evidence": ["Listing 114438158 is titled \"US - Specialist: Seasonal, Part-time\" and shows \"Weekly Hours: 40 Hours\".", "The US-Genius listing in the same sample shows 20 weekly hours."], "why": "The retail page leads with part-time work for students and parents, and the one seasonal part-time listing in the sample gives a weekly figure that does not match its title. The material does not say which is right.", "flags": ["RF12"]}, {"severity": "medium", "title": "No page in the material describes how hiring works", "evidence": ["Listings end in Submit Resume; the benefits page offers to get in touch if a profile matches a role. Neither says what happens next or how long it takes.", "No hiring-process or FAQ page was found among the pages reviewed."], "why": "A candidate can see how to apply but not the steps, timing or what follows. Hiring and interviews are also among the most frequent topics in the review answers read (11 of 73), so the gap sits where outside commentary h += sec('problems', T.sec_problems, (d.problems || []).length ? `<div class="cards">${d.problems.map(x => `<div class="card sev-${esc(x.severity)}">
<div class="sev">${esc(T.severity[x.severity] || '')}</div><h3>${esc(x.title)}</h3>
${(x.evidence || []).length ? `<div class="lbl">${esc(T.evidence)}</div>${x.evidence.map(e => `<blockquote>${txt(e)}</blockquote>`).join('')}` : ''}
${x.why ? `<div class="lbl">${esc(T.why_matters)}</div><p>${txt(x.why)}</p>` : ''}
${(x.flags || []).length ? `<div class="lbl">${esc(T.flags)}</div><p class="muted">${x.flags.map(f => esc((T.rf && T.rf[f]) || f)).join(' · ')}</p>` : ''}</div>`).join('')}</div>` : '');
// social media
if ((d.social || []).length) {
h += sec('social', T.sec_social, `<div class="tblwrap"><table><tr>${T.soc_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.social.map(x => `<tr>
<td>${esc(x.platform)}</td><td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.account || x.url)}</a>` : esc(x.account)}</td>
<td>${txt(x.purpose)}</td><td>${txt(x.sample)}</td><td>${txt(x.rhythm)}</td><td>${txt(x.people_share)}</td>
<td>${(x.themes || []).length ? list(x.themes) : ''}${x.notes ? `<p class="muted">${txt(x.notes)}</p>` : ''}</td></tr>`).join('')}</table></div>`);
}
// perception layer (reviews), never part of the score
const pr = d.perception || {};
if ((pr.themes || []).length || (pr.sample || []).length) {
let ph = `<div class="notice">${esc(T.per_note)}${pr.caveat ? ' ' + txt(pr.caveat) : ''}</div>`;
if ((pr.sample || []).length) {
ph += `<h3>${esc(T.per_sample)}</h3><div class="tblwrap"><table><tr>${T.per_sample_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.sample.map(x => `<tr><td>${esc(x.platform)}</td><td>${esc(x.reviews)}</td><td>${esc(x.period)}</td><td>${txt(x.rating)}</td></tr>`).join('')}</table></div>`;
}
if (pr.thin) ph += `<p class="muted">${esc(T.per_thin)}</p>`;
if ((pr.themes || []).length) {
ph += `<div class="tblwrap"><table><tr>${T.per_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.themes.map(x => `<tr>
<td><b>${esc(x.theme)}</b></td><td>${pr.thin || x.mentions == null ? '' : esc(x.mentions) + (x.of ? ' / ' + esc(x.of) : '')}</td>
<td>${chip(T.tone, x.tone)}</td><td>${txt(x.promise)}</td><td>${chip(T.match, x.match)}</td><td>${txt(x.note)}</td></tr>`).join('')}</table></div>`;
}
h += sec('perception', T.sec_perception, ph);
}
// plan
h += sec('plan', T.sec_plan, (d.fixes || []).length ? `<div class="cards fixes">${d.fixes.map(x => `<div class="card fix"><h3>${esc(x.title)}</h3>
<span class="effort ${x.needs_new_data ? 'data' : ''}">${esc(x.needs_new_data ? T.fix_data : T.fix_ready)}</span>
<div class="lbl">${esc(T.fix_where)}</div>${list(x.steps)}
${x.why_first ? `<div class="lbl">${esc(T.fix_why)}</div><p>${txt(x.why_first)}</p>` : ''}
${(x.needs || []).length ? `<div class="lbl">${esc(T.fix_needs)}</div>${list(x.needs)}` : ''}
${x.effort ? `<div class="lbl">${esc(T.effort_lbl)}</div><p>${esc(T.effort[x.effort] || x.effort)}${x.effort_note ? '. ' + txt(x.effort_note) : ''}</p>` : ''}
${(x.who || []).length ? `<div class="lbl">${esc(T.who)}</div><p>${x.who.map(esc).join(', ')}</p>` : ''}
${(x.check || []).length ? `<div class="lbl">${esc(T.check)}</div>${list(x.check)}` : ''}</div>`).join('')}</div>` : '');
// rewrites
h += sec('rewrites', T.sec_rewrites, (d.rewrites || []).length ? `<div class="cards">${d.rewrites.map(x => `<div class="card"><h3>${esc(x.title)}</h3>
${x.problem ? `<div class="lbl">${esc(T.rw_problem)}</div><p>${txt(x.problem)}</p>` : ''}
${x.logic ? `<div class="lbl">${esc(T.rw_logic)}</div><p>${txt(x.logic)}</p>` : ''}
<div class="rw"><div><div class="lbl">${esc(T.rw_original)}</div><div class="before">${txt(x.original)}</div></div>
<div><div class="lbl">${esc(T.rw_rewrite)}</div><div class="after">${txt(x.rewrite)}</div></div></div>
${(x.notes || []).length ? `<ul class="qlist">${x.notes.map(n => `<li><span class="tag ${n.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[n.kind] || n.kind)}</span>${txt(n.text)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>` : '');
// questions
const qs = d.questions || [];
if (qs.length) {
const grp = k => qs.filter(q => (q.for || 'communication') === k);
const qhtml = ['communication', 'audit'].map(k => grp(k).length ? `<h3 style="margin:18px 0 6px">${esc(T.q_for[k])}</h3><ul class="qlist">${grp(k).map(q => `<li><span class="tag ${q.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[q.kind] || q.kind)}</span>${txt(q.text)}</li>`).join('')}</ul>` : '').join('');
h += sec('questions', T.sec_questions, `<p class="muted">${esc(T.q_note)}</p>${qhtml}`);
}
// manual import checklist
if ((d.manual_import || []).length) {
h += sec('manual', T.sec_manual, `<p class="muted">${esc(T.manual_note)}</p><div class="cards">${d.manual_import.map(x => `<div class="card"><h3>${esc(x.platform)}</h3>
${safeUrl(x.url) ? `<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>` : ''}
${(x.capture || []).length ? `<div class="lbl">${esc(T.manual_capture)}</div>${list(x.capture)}` : ''}</div>`).join('')}</div>`);
}
// appendix
let app2 = '';
if ((d.source_map || []).length) {
app2 += `<h3>${esc(T.app_map)}</h3><div class="tblwrap"><table><tr>${T.map_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.source_map.map(x => `<tr>
<td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>` : esc(x.source)}</td><td>${esc(x.kind)}</td>
<td>${chip(T.decision, x.decision)}</td><td>${txt(x.reason)}</td></tr>`).join('')}</table></div>`;
}
if ((d.genericity || []).length) {
app2 += `<h3>${esc(T.app_genericity)}</h3><div class="tblwrap"><table><tr>${T.gen_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.genericity.map(g => `<tr>
<td>${txt(g.claim)}</td><td>${chip(T.gen.verdict, g.verdict)}</td><td>${chip(T.gen.substitution, g.substitution)}</td><td>${chip(T.gen.ubiquity, g.ubiquity)}</td>
<td>${chip(T.gen.specificity, g.specificity)}</td><td>${chip(T.gen.defensibility, g.defensibility)}</td><td>${txt(g.why)}</td></tr>`).join('')}</table></div>`;
}
if ((d.ledger || []).length) {
app2 += `<h3>${esc(T.app_ledger)}</h3><div class="tblwrap"><table><tr>${T.led_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.ledger.map(l => `<tr>
<td>${txt(l.claim)}</td><td>${esc(T.led.class[l.class] || '')}</td><td>${txt(l.evidence)}</td><td>${chip(T.led.strength, l.strength)}</td>
<td>${chip(T.led.status, l.status)}</td><td>${txt(l.comment)}</td></tr>`).join('')}</table></div>`;
}
const det = (d.dimensions || []).flatMap(x => (x.criteria || []).map(c => [x.id, c]));
if (det.length) {
app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
