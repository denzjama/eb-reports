<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

mpty description, and none of the 15 links to the careers site or a job. The employee-led shorts, with titles that translate as a quick interview with colleagues, a day in the factory and my first salary, are the only factory-floor employee content found in this audit. They are in Hungarian only."}], "perception": {"sample": [{"platform": "Comparably", "reviews": 60, "period": "Not shown: the platform displays review texts without dates", "rating": "Culture 4.1/5, shown on Comparably on 2026-10-27, based on 2,605 ratings from 382 participants; the reviews page counts 272 reviews"}, {"platform": "SEEK Australia", "reviews": 3, "period": "August to October 2026", "rating": "3.9/5, shown on SEEK on 2026-10-27, based on 57 reviews"}], "thin": false, "themes": [{"theme": "Culture and team", "mentions": 24, "of": 63, "tone": "mixed", "promise": "A principle-led culture and one big team guided by the Five Principles", "match": "mixed", "note": "Supportive, collaborative colleagues appear often. One author says the Five Principles are taken seriously and have consequences. Others describe gossip, a two-faced culture, and poor performers moved around the organisation. The family framing is praised by one author and criticised by another."}, {"theme": "Management and leadership", "mentions": 17, "of": 63, "tone": "mixed", "promise": "Every idea counts and everyone has a voice (Why Join Mars)", "match": "mixed", "note": "Praise for approachable, engaged leaders sits beside requests for better communication, fairness on promotions, change management and understanding of the workforce."}, {"theme": "Pay and benefits", "mentions": 10, "of": 63, "tone": "positive", "promise": "Competitive pay for Associates at every level, in every type of role", "match": "mixed", "note": "Seven of the ten are positive about base pay, bonus, pension or medical benefits. One says salary is no longer competitive, one says pay should rise, and one calls the benefits programme inconsistently applied."}, {"theme": "The hiring process", "mentions": 9, "of": 63, "tone": "mixed", "promise": "We want you to be successful; a collaborative application journey", "match": "mixed", "note": "Authors describe interviews as relaxed, informative and clear about expectations. Criticism covers slow replies and hiring too broadly."}, {"theme": "Workload, schedule and conditions", "mentions": 7, "of": 63, "tone": "negative", "promise": "Flexibility and finding the balance between work and play, prioritised every day", "match": "tension", "note": "Most describe production conditions: dress and safety rules, an attendance point system, short-staffed shifts, pressure to work long hours, little for the night shift. One shift worker rates the hours as good."}, {"theme": "Conflict and safety between co-workers", "mentions": 4, "of": 63, "tone": "negative", "promise": "We care about our Associates; a confidential Ombudsmen channel", "match": "tension", "note": "Authors describe aggression or harassment by co-workers that, in their account, superiors did not handle."}, {"theme": "Growth and promotion", "mentions": 4, "of": 63, "tone": "mixed", "promise": "Grow with a new role, a new area of the business or a new location", "match": "mixed", "note": "Two authors see good growth, one asks for fairness on promotions, one says there is no training. Too few mentions to read a pattern."}, {"theme": "Job security and turnover", "mentions": 3, "of": 63, "tone": "negative", "promise": "A family business where you come first", "match": "tension", "note": "Authors mention high turnover, hiring and firing in large numbers, and a dismissal without stated reasons."}], "caveat": "Reviewers select themselves, and review sites over-represent strong opinions. Comparably shows answers to prompted questions, half of which ask what is wrong, so the prompt shapes the tone. Its texts carry no dates. One Comparably answer appears under three questions and is counted once. The AI-generated summary on SEEK was not used."}, "manual_import": [{"platform": "LinkedIn", "url": "https://www.linkedin.com/company/mars", "capture": ["Profile header with bio and follower count", "Latest 9–12 posts", "3–5 recent posts about people, work or hiring, opened with captions", "Pinned posts", "The Life tab sections"]}, {"platform": "Instagram", "url": "https://www.instagram.com/careersatmars", "capture": ["Profile header with bio and follower count for @careersatmars and @lifeatmars", "Grid of the latest 9–12 posts", "3–5 posts about people, work or hiring with captions", "Pinned posts and highlights"]}, {"platform": "Facebook", "url": "https://www.facebook.com/LifeAtMars", "capture": ["Page header with followers", "Latest 9–12 posts", "3–5 posts about people or hiring with captions", "Pinned post"]}, {"platform": "X", "url": "https://twitter.com/Marsglobal", "capture": ["Profile header", "Latest 9–12 posts", "Any recruiting or people posts"]}, {"platform": "Glassdoor", "url": "https://www.glassdoor.com/Overview/Working-at-Mars-EI_IE2886.11,15.htm", "capture": ["Rating page with review count and date", "15–30 most recent reviews without reviewer names, saved to social/reviews/"]}, {"platform": "Indeed", "url": "https://www.indeed.com/cmp/Mars/reviews", "capture": ["Rating page", "Most recent reviews, saved to social/reviews/"]}, {"platform": "Job ads (careers.mars.com)", "url": "https://careers.mars.com/global/en", "capture": ["8–12 current ads as PDF or full-text screenshots: a production operator, a material handler or packaging operator, an apprentice or early-careers role, a field sales role, an IT or data role, an R&D role, a finance or support-services role"]}, {"platform": "Employee stories (careers.mars.com)", "url": "https://careers.mars.com/global/en/making-a-difference", "capture": ["3–6 full story pages, for example the intern-to-technologist story and the 19-years story, as text or screenshots"]}], "scope": {"reviewed": ["Eleven pages of careers.mars.com captured on 2026-10-27: five from the global English section, four from the Australia and New Zealand section and two from the Middle East and Africa section", "The latest 15 uploads of the corporate YouTube channel linked from the careers site", "Employee reviews on Comparably and SEEK Australia, reported separately from the score"], "not_reviewed": ["Job ads: none of the 165 in the site map could be read", "Full employee stories: none of the 129 story pages could be read", "LinkedIn, Instagram, Facebook and X accounts (closed platforms, manual import)", "Glassdoor, Indeed and kununu reviews (blocked or closed)", "Non-English sections of careers.mars.com, the Kellanova careers site, and separate Royal Canin, Mars Veterinary Health and Kind candidate sites", "The interview experience itself and what employees say outside public channels"]}, "summary": {"points": ["The only promise that depends on Mars itself is Dogs @ Work, which the home page ties to the petcare purpose with four employee quotes from four cities. The benefits page lists it under perks. The lead promises of growth, care and impact contain no Mars-specific detail and could be published unchanged by any large group.", "The lead promise is growth through a new role, a new area of the business or a new location. No figure, no readable story and no example of a move sits beside it. The learning offers, such as Mars U, coaching and LinkedIn Learning, are listed on another page and never linked to moving.", "The strongest proof is regional. The Australia and New Zealand inclusion page shows dated 2026 activity, 40+ trained mental-health confidants, 16 weeks of fully paid parental leave and named recognitions. The clearest hiring FAQs are in the Australia and Middle East sections. The global pages reviewed carry mostly lists and adjectives.", "Factory and operations candidates get the least. The Supply Chain & Engineering page counts 20,000 Associates but says nothing about shifts, pay logic, safety or training. The only factory-floor employee content found is four Hungarian-language shorts on the corporate YouTube channel.", "In 63 review texts, culture, team and management are mixed, and pay is mostly positive. Workload and production conditions are mostly negative. The careers pages reviewed say least about workload and production conditions."], "actions": ["Put evidence of internal moves (yearly figures and three or four story bodies) next to the growth promise on the home page.", "Build a factory and operations page covering shifts, pay logic, safety and training, with operator voices, and subtitle and link the existing factory shorts.", "Replace the superlatives and the open-ended flexibility line with scoped facts, and give the volunteering figures a current year."]}, "dimensions": [{"id": "clarity", "score": 7, "max": 12, "assessable": true, "why": "A candidate can piece together an offer of growth by moving within a large family-owned group, but has to assemble it from several sections. The home page gives career, reward, wellbeing, teams and dogs equal weight. The language is mostly plain, with some unexplained internal terms.", "criteria": [{"name": "Employer proposition identifiable", "score": 2, "max": 4, "assessable": true, "note": "The hero line “Your tomorrow starts today” says nothing on its own. The offer, growth through a new role, area or location, appears in the second home section and competes with four others."}, {"name": "Candidate benefit explicit", "score": 3, "max": 4, "assessable": true, "note": "The benefits page lists concrete items by category. Why Join Mars is mostly company self-description in the first person plural."}, {"name": "Message hierarchy", "score": 1, "max": 2, "assessable": true, "note": "The Australian page has a promise with three pillars. The global home page has no lead idea that the sections below carry."}, {"name": "Accessibility", "score": 1, "max": 2, "assessable": true, "note": "Terms such as Associate Concept and HPC planning session are not explained, and the R&D page uses abstract phrasing like translating process specifications to the production line."}]}, {"id": "differentiation", "score": 8, "max": 16, "assessable": true, "why": "None of the four core promises depends on Mars alone. The Five Principles and the named volunteering programmes come closest. The one idea that does depend on Mars, pets at work, is presented as a perk. Specific assets exist, and the proposition pages wrap them in lexicon phrases.", "criteria": [{"name": "Competitor substitution resistance", "score": 2, "max": 5, "assessable": true, "note": "Growth and care fit any comparable employer unchanged; principles and impact mostly do. Only the secondary Dogs @ Work claim depends on Mars."}, {"name": "Category cliché resistance", "score": 1, "max": 3, "assessable": true, "note": "The proposition copy runs on lexicon phrases: best-in-class development, brilliant benefits, passionate and dedicated people, make an impact. Specifics sit on other pages."}, {"name": "Employer-specific advantages", "score": 3, "max": 4, "assessable": true, "note": "Family ownership, the Five Principles, several business segments, the volunteer and ambassador programmes, the Ombudsmen and pets at work are used. Only some are tied to what the candidate gets."}, {"name": "Defensibility", "score": 1, "max": 2, "assessable": true, "note": "The principles and the pet link rest on something Mars has. The rest could be claimed by any employer at no cost."}, {"name": "Memorability", "score": 1, "max": 2, "assessable": true, "note": "“Your tomorrow starts today” repeats across pages and hashtags, but it says nothing about the work."}]}, {"id": "proof", "score": 9, "max": 16, "assessable": true, "why": "Four of seven promises have partial support: care, the Five Principles, pets at work and inclusion. None is fully supported. The lead promise of growth through mobility and the impact promise have only weak support. Most of the better proof is scoped to one region or sits on a different page from the promise.", "criteria": [{"name": "Claim evidence coverage", "score": 3, "max": 6, "assessable": true, "note": "Several promises are partly supported. Two of the four core promises, growth and impact, lack meaningful support."}, {"name": "Evidence specificity", "score": 2, "max": 4, "assessable": true, "note": "About half the promises have support, and all of it is moderate: practices and programmes without outcomes."}, {"name": "Evidence relevance", "score": 2, "max": 3, "assessable": true, "note": "Support demonstrates some promises, and several only for Australia and New Zealand."}, {"name": "Claim and evidence proximity", "score": 2, "max": 3, "assessable": true, "note": "Care, pets and inclusion have proof on the same page. Proof for the principles is spread across the hiring and volunteering pages."}]}, {"id": "audience_fit", "score": 7, "max": 12, "assessable": true, "why": "Graduates are well served, with streams, preferred degrees, a mentor and the date applications reopen. The home page addresses everyone from experienced hires to beginners. Factory and retail candidates get one line on the benefits page. The material makes few choices that would deter anyone.", "criteria": [{"name": "Audience definition", "score": 2, "max": 3, "assessable": true, "note": "Function and graduate pages name their audience. The home page addresses all experience levels at once."}, {"name": "Motivation relevance", "score": 2, "max": 4, "assessable": true, "note": "Graduates get decision facts. The Supply Chain & Engineering page gives operational candidates no shift, pay or safety information."}, {"name": "Segmentation", "score": 2, "max": 3, "assessable": true, "note": "Graduates and R&D get adapted messages. Factory and retail roles share the office-oriented proposition."}, {"name": "Trade-offs", "score": 1, "max": 2, "assessable": true, "note": "Only small choices are visible, such as a preferred background of any engineering degree except civil engineering for engineering graduates and the Freedom principle tied to performance."}]}, {"id": "employee_truth", "score": 5, "max": 10, "assessable": true, "why": "Culture is shown through practices: an Ombudsmen channel, trained mental-health confidants in Australia and New Zealand, a biennial award, volunteering programmes, dogs at work, and rules for meetings and travel. Work reality appears mainly in the graduate streams. Difficulty is barely named. Employee voice was not assessed because the story pages could not be read.", "criteria": [{"name": "Employee voice", "score": 0, "max": 3, "assessable": false, "note": "Not assessed: 129 story pages exist but their text could not be read."}, {"name": "Work reality", "score": 2, "max": 3, "assessable": true, "note": "The graduate streams name tasks such as factory projects, automation, product trials and contract negotiation. Function pages stay high level."}, {"name": "Tensions and trade-offs", "score": 1, "max": 2, "assessable": true, "note": "Only hints: a fast-paced engineering environment, and a recruiter noting that interviewing can feel intimidating."}, {"name": "Behaviour over adjectives", "score": 2, "max": 2, "assessable": true, "note": "Concrete practices and policies are described on the benefits, inclusion and Making a Difference pages."}]}, {"id": "consistency", "score": 8, "max": 12, "assessable": true, "why": "The purpose line and the Five Principles run through every page, from the proposition to the interview tips. The growth promise does not reach the function pages or the YouTube channel. Some figures disagree between pages.", "criteria": [{"name": "Core promise alignment", "score": 3, "max": 5, "assessable": true, "note": "Most pages carry the purpose and principles. The Supply Chain & Engineering page and the YouTube sample do not carry the growth promise."}, {"name": "Proof alignment", "score": 2, "max": 3, "assessable": true, "note": "Proof supports care, principles and inclusion. Nothing supports the growth story."}, {"name": "Tone and message coherence", "score": 2, "max": 2, "assessable": true, "note": "The same vocabulary appears throughout: Associates, the Five Principles, the purpose line."}, {"name": "Contradiction resistance", "score": 1, "max": 2, "assessable": true, "note": "Five global resource groups on one page, over 90 on another. The headcount is given as 140,000+, 150,000+ and about 170,000."}]}, {"id": "candidate_relevance", "score": 4, "max": 12, "assessable": true, "why": "Reasons to join are given, but they are generic. The hiring FAQs answer practical questions well. Role reality and decision facts such as pay, schedule and location sit in job ads, which could not be read, so those two criteria were left out.", "criteria": [{"name": "Why join", "score": 2, "max": 3, "assessable": true, "note": "Growth, care, purpose and perks are offered without a reason specific to Mars."}, {"name": "Work and role reality", "score": 0, "max": 3, "assessable": false, "note": "Not assessed: depends on job ads, which could not be read."}, {"name": "Relevant decision factors", "score": 0, "max": 3, "assessable": false, "note": "Not assessed: pay, schedule and location are normally stated in job ads, which could not be read."}, {"name": "Candidate questions and friction", "score": 2, "max": 3, "assessable": true, "note": "The FAQs cover employment gaps, CV length, adjustments, data access and multiple applications. Doubts about the work itself are not addressed."}]}, {"id": "conversion", "score": 8, "max": 10, "assessable": true, "why": "The next step is clear: a job search by category, country and city, and a talent community. Effort is explained (about 25 minutes, what you need, two attempts at the video interview). Calls to action are mostly the same generic talent-community block, and the stages of the typical hiring journey sit in pop-ups whose text was not captured.", "criteria": [{"name": "Next-step clarity", "score": 3, "max": 3, "assessable": true, "note": "View Jobs, job search filters and talent-community sign-up are on every page. Legacy Kellanova roles are routed to a separate site, with an explanation."}, {"name": "Decision support near the call to action", "score": 1, "max": 2, "assessable": true, "note": "View Jobs follows the growth paragraph. The talent-community block stands alone."}, {"name": "Friction reduction", "score": 2, "max": 2, "assessable": true, "note": "The FAQs give the time to apply, what you need to apply, how to request adjustments and that the video interview allows a couple of attempts."}, {"name": "Call-to-action relevance", "score": 1, "max": 2, "assessable": true, "note": "Mostly the same talent-community prompt. The graduate page's register-interest prompt, with the 2027 reopening date, is the exception."}, {"name": "Process transparency", "score": 1, "max": 1, "assessable": true, "note": "Recruiter review, contact by email or phone, an early phone interview, and HireVue for high-volume roles are described."}]}], "strengths": [{"title": "Pets at work is the one idea only Mars can claim", "text": "The home page ties dogs at work to the purpose “A BETTER WORLD FOR PETS”. It gives a ten-year timeframe and four quotes from employees named by first name in London, Washington D.C., Mexico City and Tokyo, each describing a concrete effect, such as a dog serving as a finance team mascot. It is the only promise in the material that would stop making sense if another employer's name replaced Mars."}, {"title": "The hiring FAQs answer practical questions", "text": "The Australian and Middle East pages say the application takes about 25 minutes and list what is needed. They say who sees the data, that several roles can be applied for, how to ask for adjustments, and that employment gaps need not be explained. A fraud notice says candidates are never asked for fees or financial details. The Australian inclusion page names a contact person for transgender applicants."}, {"title": "The Five Principles are carried into hiring", "text": "Two named Talent Acquisition leaders advise candidates to study the Five Principles and be ready to discuss how they match their own values. The Make the Difference Awards, held every other year, recognise Associates who put the principles into action. The culture promise therefore has a practice behind it, not only a list of values."}, {"title": "The inclusion page shows practice with dates", "text": "The Australia and New Zealand page lists six local resource-group chapters, over 40 Hear2Help Ambassadors trained as Mental Health First Aiders, 16 weeks of fully paid parental leave for all parents regardless of gender or sexual orientation, a First Nations work-experience programme at the Wodonga site, and dated 2026 activities and recognitions."}, {"title": "The graduate page gives decision facts", "text": "Each stream names its tasks and preferred degrees. Graduates get a senior-leader mentor and an individual development plan, and the page states that applications reopen in 2027 for the 2028 programme."}], "problems": [{"severity": "high", "title": "The lead promise, growth by moving across roles, businesses and countries, has no evidence that such moves happen.", "evidence": ["Home page: “At Mars, career development is shaped by opportunity, mobility, and possibility. Associates are empowered to grow, whether it’s with a new role, a new area of our global business, or a new location.”", "The same page promises “best-in-class development” in the Rewarding Career section. The Australian page repeats the idea as Room for you to grow.", "Support found: a list of learning offers on the benefits page (Mars U, coaching and mentoring, development for new managers, LinkedIn Learning) and story titles such as an intern-to-technologist journey, whose text could not be read. No figure for internal moves and no example of a move between businesses or countries appears."], "why": "This is the promise the home page leads with, and the material gives a candidate nothing to check it against. The learning offers are inputs, they sit on another page, and nothing connects them to moving. The site holds 129 story pages, but none of their text could be read, so any proof they contain was not visible in this audit.", "flags": ["RF14", "RF01"]}, {"severity": "high", "title": "Factory and operations candidates get almost nothing specific.", "evidence": ["The Supply Chain & Engineering page says 20,000 Associates work in the function and that they could be expected to take personal ownership for managing equipment design, logistics, workforce deployment, management and more. It says nothing about shifts, pay logic, safety, training or progression.", "The proposition pages describe office life: bake-off events, dogs in the office in certain locations, hybrid working. The only line aimed at other sites is the perk “Inviting work sites, whether you're in a factory, retail store, or office”.", "The YouTube sample holds four Hungarian-language shorts about named employees, including titles that translate as a day in the factory and my first salary. They are not in English and are not linked from the careers pages."], "why": "The site map lists production, packaging and material-handling operator roles among the job titles. The careers pages reviewed give these candidates no work reality and no decision facts. Factory-floor employee content exists, but only in one language on a corporate channel. In the reviews, workload and production conditions are the most frequent negative theme. The careers pages reviewed do not address it.", "flags": ["RF09", "RF11"]}, {"severity": "medium", "title": "Superlatives stand in for facts on the benefits and home pages.", "evidence": ["“Market-leading parental leave (e.g., 18 weeks fully paid for both parents in the US)”", "“Industry-leading safety standards”", "“Our exceptional benefits and wellbeing programs are designed with you in mind.”", "Home page: “best-in-class development” and brilliant benefits."], "why": "None of these comparisons has a source or a basis in the material. The parental-leave line already has a precise US fact, and the superlative adds a market claim the page does not support. A precise fact stated plainly makes the case without it.", "flags": ["RF02"]}, {"severity": "medium", "title": "The flexibility promise has no stated boundaries.", "evidence": ["Benefits page: “With a workforce spanning the globe, we’ve already been supporting flexible working for more than a decade. And now we’re able to offer even more freedom – with even greater choice about where, when and how you work.”", "The same page lists hybrid working as a perk marked “Location and role dependent”, and says Associates work in environments that best meet the needs of the business, you and your team.", "Only the Australian inclusion page names options: working from home, flexible hours, part-time and other options, without saying for which roles."], "why": "The promise speaks to everyone, and the qualifier sits two sections away without saying which roles or sites it covers. A factory or retail candidate cannot tell from the material whether any of the choice applies to them.", "flags": ["RF06", "RF18"]}, {"severity": "medium", "title": "The most concrete numbers on the site do not show that the programmes are running now.", "evidence": ["Making a Difference: since the Mars Volunteer Program was founded in 2015, Associates from 312 sites have volunteered over 163,000 hours.", "The Mars Ambassador Program: as of 2025, more than 1,100 Associates from 60+ countries have volunteered, for 70,000 hours. It is open to eligible Associates, and the page does not define eligibility."], "why": "Both figures are running totals over many years. They show the programmes have existed. They do not show how many people take part in a current year. These are the most specific figures behind the impact promise, and a yearly figure would turn them into current proof.", "flags": []}, {"severity": "low", "title": "Basic figures disagree between pages.", "evidence": ["Inclusion page: “Globally Mars is pleased to have five Associate Resource Groups.”", "Graduate page: “With over 90 resource groups globally, you can impact the communities you care about.”", "Headcount: 150,000+ on the benefits page, 170,000 on the inclusion page, approximately 170,000 in a 2026 YouTube description and 140,000+ in the YouTube channel description."], "why": "The material does not explain whether the 90 groups are local chapters of the five. The headcount figures may reflect different dates. As they stand, the pages give a careful reader two answers to simple questions.", "flags": ["RF12"]}], "fixes": [{"title": "Put evidence of internal moves next to the growth promise.", "needs_new_data": true, "steps": ["Under the #ProudlyMars paragraph on the global home page, add one or two yearly figures: how many Associates moved to a new role, a new business segment or a new country.", "Make three or four existing story pages about moves readable and link them there, for example the intern-to-technologist story, and add one from a factory or operations role.", "Move the learning offers (Mars U, coaching and mentoring, development for new managers) onto the same section and say which ones support a move."], "why_first": "Growth through mobility is the promise the home page leads with, and it currently has the weakest support. Proof here changes the main story, not a side claim.", "needs": ["Internal mobility figures by year: moves across roles, segments and countries", "Story bodies that are readable without scripts", "Which learning offers apply in which locations"], "effort": "large", "effort_note": "Needs data from HR systems across segments and new or reworked story content.", "who": ["Talent and HR analytics (mobility data)", "Careers-site owner (page and story template)", "Associates who have moved (stories)"], "check": ["Whether candidates mention moving between businesses or countries at the first screening call", "Traffic from the home page to the linked mobility stories", "Whether the story and job-ad text appears in the page source when checked with a plain text browser"]}, {"title": "Build a factory and operations page with real conditions and operator voices.", "needs_new_data": true, "steps": ["Add a section to the Supply Chain & Engineering page, or a linked page, covering shift patterns, pay logic, safety, training and progression routes from operator roles.", "Add English subtitles to the Hungarian factory shorts on the corporate channel, with consent, and link them from this page. Commission similar short videos at one or two other sites.", "Name one real demand of the work, such as shift work or safety rules, and say how it is handled."], "why_first": "It closes the largest audience gap in the material. It is also the most frequent negative theme in the reviews, and the careers pages reviewed say nothing about it.", "needs": ["Shift patterns and pay logic by site or role family", "Training and progression routes for operators", "Consent and subtitles for the existing Hungarian shorts"], "effort": "large", "effort_note": "Needs input from several plants and new video or story content.", "who": ["Plant HR leads (shifts, pay logic, training)", "Mars Hungary communications team (existing shorts)", "Operators and shift leads (voices)"], "check": ["Questions operator candidates ask at screening about shifts and pay", "Early leavers in operator roles citing conditions they did not expect", "Visits to the operations page from operator job ads"]}, {"title": "Replace superlatives and open promises with scoped facts.", "needs_new_data": true, "steps": ["On the benefits page, remove market-leading, industry-leading, exceptional and best-in-class. Keep the facts, such as 18 weeks of fully paid parental leave for both parents in the US.", "Rewrite the future-of-work paragraph so it says which roles or kedIn Learning.\n[Information needed: how many Associates moved role, business or country last year, with two or three of their stories.]", "notes": [{"kind": "evidence", "text": "Yearly figures for internal moves across roles, business segments and countries."}, {"kind": "confirm", "text": "Whether the development offers listed on the benefits page are available in every location."}]}, {"title": "Benefits page, parental leave line", "original": "Market-leading parental leave (e.g., 18 weeks fully paid for both parents in the US)", "problem": "A market comparison with no basis in the material, wrapped around a precise fact.", "logic": "Lead with the fact and keep its US scope. Keep the page's own qualifier about location and role.", "rewrite": "Parental leave: 18 weeks fully paid for both parents in the US. Entitlements depend on location and role.\n[Information needed: entitlements in other countries.]", "notes": [{"kind": "confirm", "text": "Whether the 16 weeks of fully paid parental leave described on the inclusion page in the Australia and New Zealand section applies in both countries, so it can be added here."}, {"kind": "evidence", "text": "Parental-leave entitlements in other markets."}]}, {"title": "Benefits page, future of work", "original": "With a workforce spanning the globe, we’ve already been supporting flexible working for more than a decade. And now we’re able to offer even more freedom – with even greater choice about where, when and how you work.", "problem": "A promise to everyone, with the role and location qualifier placed elsewhere on the page.", "logic": "Keep the decade-long history, which is a fact, and put the qualifier inside the promise. Leave the role scope as a gap until it is supplied.", "rewrite": "With a workforce spanning the globe, we've supported flexible working for more than a decade. Hybrid working opportunities depend on your location and role.\n[Information needed: which roles and sites can work hybrid or flexibly, and what ce is built from standard phrases such as \"great team\" or \"growth opportunities\".</li>\n  <li><b>Specifics.</b> Figures with time frames, named practices, conditions, constraints.</li>\n  <li><b>Can you own it.</b> Whether the claim rests on something the company really has and the material shows.</li>\n</ul>\n<h4 class=\"howto-h\">Labels in the text</h4>\n<ul class=\"howto-list\">\n  <li><span class=\"tag tag-q\">Confirm</span> a likely fact the company needs to confirm. Until then it is not used as a fact.</li>\n  <li><span class=\"tag tag-e\">Information needed</span> the material does not contain it, and the copy cannot be strengthened without it.</li>\n  <li><b>Supported, partly, weakly, not supported</b>: how well a claim is backed inside the material itself. This is not independent fact-checking.</li>\n</ul>\n"};

}
// what works
h += sec('working', T.sec_working, (d.strengths || []).length ? `<div class="cards">${d.strengths.map(x => `<div class="card good"><h3>${esc(x.title)}</h3><p>${txt(x.text)}</p></div>`).join('')}</div>` : '');
// problems
h += sec('problems', T.sec_problems, (d.problems || []).length ? `<div class="cards">${d.problems.map(x => `<div class="card sev-${esc(x.severity)}">
<div class="sev">${esc(T.severity[x.severity] || '')}</div><h3>${esc(x.title)}</h3>
${(x.evidence || []).length ? `<div class="lbl">${esc(T.evidence)}</div>${x.evidence.map(e => `<blockquote>${txt(e)}</blockquote>`).join('')}` : ''}
${x.why ? `<div class="lbl">${esc(T.why_matters)}</div><p>${txt(x.why)}</p>` : ''}
${(x.flags || []).length ? `<div class="lbl">${esc(T.flags)}</div><p class="muted">${x.flags.map(f => esc((T.rf && T.rf[f]) || f)).join(' · ')}</p>` : ''}</div>`).join('')}</div>` : '');
// social media
if ((d.social || []).length) {
h += sec('social', T.sec_social, `<div class="tblwrap"><table><tr>${T.soc_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.social.map(x => `<tr>
<td>${esc(x.platform)}</td><td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.account || x.url)}</a>` : esc(x.account)}</td>
<td>${txt(x.purpose)}</td><td>${txt(x.sample)}</td><td>${txt(x.rhythm)}</td><td>${txt(x.people_share)}</td>
<td>${(x.themes || []).length ? list(x.themes) : ''}${x.notes ? `<p class="muted">${txt(x.notes)}</p>` : ''}</td></tr>`).join('')}</table></div>`);
}
// perception layer (reviews), never part of the score
const pr = d.perception || {};
if ((pr.themes || []).length || (pr.sample || []).length) {
let ph = `<div class="notice">${esc(T.per_note)}${pr.caveat ? ' ' + txt(pr.caveat) : ''}</div>`;
if ((pr.sample || []).length) {
ph += `<h3>${esc(T.per_sample)}</h3><div class="tblwrap"><table><tr>${T.per_sample_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.sample.map(x => `<tr><td>${esc(x.platform)}</td><td>${esc(x.reviews)}</td><td>${esc(x.period)}</td><td>${txt(x.rating)}</td></tr>`).join('')}</table></div>`;
}
if (pr.thin) ph += `<p class="muted">${esc(T.per_thin)}</p>`;
if ((pr.themes || []).length) {
ph += `<div class="tblwrap"><table><tr>${T.per_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.themes.map(x => `<tr>
<td><b>${esc(x.theme)}</b></td><td>${pr.thin || x.mentions == null ? '' : esc(x.mentions) + (x.of ? ' / ' + esc(x.of) : '')}</td>
<td>${chip(T.tone, x.tone)}</td><td>${txt(x.promise)}</td><td>${chip(T.match, x.match)}</td><td>${txt(x.note)}</td></tr>`).join('')}</table></div>`;
}
h += sec('perception', T.sec_perception, ph);
}
// plan
h += sec('plan', T.sec_plan, (d.fixes || []).length ? `<div class="cards fixes">${d.fixes.map(x => `<div class="card fix"><h3>${esc(x.title)}</h3>
<span class="effort ${x.needs_new_data ? 'data' : ''}">${esc(x.needs_new_data ? T.fix_data : T.fix_ready)}</span>
<div class="lbl">${esc(T.fix_where)}</div>${list(x.steps)}
${x.why_first ? `<div class="lbl">${esc(T.fix_why)}</div><p>${txt(x.why_first)}</p>` : ''}
${(x.needs || []).length ? `<div class="lbl">${esc(T.fix_needs)}</div>${list(x.needs)}` : ''}
${x.effort ? `<div class="lbl">${esc(T.effort_lbl)}</div><p>${esc(T.effort[x.effort] || x.effort)}${x.effort_note ? '. ' + txt(x.effort_note) : ''}</p>` : ''}
${(x.who || []).length ? `<div class="lbl">${esc(T.who)}</div><p>${x.who.map(esc).join(', ')}</p>` : ''}
${(x.check || []).length ? `<div class="lbl">${esc(T.check)}</div>${list(x.check)}` : ''}</div>`).join('')}</div>` : '');
// rewrites
h += sec('rewrites', T.sec_rewrites, (d.rewrites || []).length ? `<div class="cards">${d.rewrites.map(x => `<div class="card"><h3>${esc(x.title)}</h3>
${x.problem ? `<div class="lbl">${esc(T.rw_problem)}</div><p>${txt(x.problem)}</p>` : ''}
${x.logic ? `<div class="lbl">${esc(T.rw_logic)}</div><p>${txt(x.logic)}</p>` : ''}
<div class="rw"><div><div class="lbl">${esc(T.rw_original)}</div><div class="before">${txt(x.original)}</div></div>
<div><div class="lbl">${esc(T.rw_rewrite)}</div><div class="after">${txt(x.rewrite)}</div></div></div>
${(x.notes || []).length ? `<ul class="qlist">${x.notes.map(n => `<li><span class="tag ${n.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[n.kind] || n.kind)}</span>${txt(n.text)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>` : '');
// questions
const qs = d.questions || [];
if (qs.length) {
const grp = k => qs.filter(q => (q.for || 'communication') === k);
const qhtml = ['communication', 'audit'].map(k => grp(k).length ? `<h3 style="margin:18px 0 6px">${esc(T.q_for[k])}</h3><ul class="qlist">${grp(k).map(q => `<li><span class="tag ${q.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[q.kind] || q.kind)}</span>${txt(q.text)}</li>`).join('')}</ul>` : '').join('');
h += sec('questions', T.sec_questions, `<p class="muted">${esc(T.q_note)}</p>${qhtml}`);
}
// manual import checklist
if ((d.manual_import || []).length) {
h += sec('manual', T.sec_manual, `<p class="muted">${esc(T.manual_note)}</p><div class="cards">${d.manual_import.map(x => `<div class="card"><h3>${esc(x.platform)}</h3>
${safeUrl(x.url) ? `<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>` : ''}
${(x.capture || []).length ? `<div class="lbl">${esc(T.manual_capture)}</div>${list(x.capture)}` : ''}</div>`).join('')}</div>`);
}
// appendix
let app2 = '';
if ((d.source_map || []).length) {
app2 += `<h3>${esc(T.app_map)}</h3><div class="tblwrap"><table><tr>${T.map_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.source_map.map(x => `<tr>
<td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>` : esc(x.source)}</td><td>${esc(x.kind)}</td>
<td>${chip(T.decision, x.decision)}</td><td>${txt(x.reason)}</td></tr>`).join('')}</table></div>`;
}
if ((d.genericity || []).length) {
app2 += `<h3>${esc(T.app_genericity)}</h3><div class="tblwrap"><table><tr>${T.gen_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.genericity.map(g => `<tr>
<td>${txt(g.claim)}</td><td>${chip(T.gen.verdict, g.verdict)}</td><td>${chip(T.gen.substitution, g.substitution)}</td><td>${chip(T.gen.ubiquity, g.ubiquity)}</td>
<td>${chip(T.gen.specificity, g.specificity)}</td><td>${chip(T.gen.defensibility, g.defensibility)}</td><td>${txt(g.why)}</td></tr>`).join('')}</table></div>`;
}
if ((d.ledger || []).length) {
app2 += `<h3>${esc(T.app_ledger)}</h3><div class="tblwrap"><table><tr>${T.led_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.ledger.map(l => `<tr>
<td>${txt(l.claim)}</td><td>${esc(T.led.class[l.class] || '')}</td><td>${txt(l.evidence)}</td><td>${chip(T.led.strength, l.strength)}</td>
<td>${chip(T.led.status, l.status)}</td><td>${txt(l.comment)}</td></tr>`).join('')}</table></div>`;
}
const det = (d.dimensions || []).flatMap(x => (x.criteria || []).map(c => [x.id, c]));
if (det.length) {
app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
