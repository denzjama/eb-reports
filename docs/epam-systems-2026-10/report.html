<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

"}, {"theme": "Client work and technology", "mentions": 5, "of": 56, "tone": "mixed", "promise": "World-class clients; advanced tech stack (Lithuania-relocation ad)", "match": "mixed", "note": "Answers say the technology, new or old, depends on the client. One describes feeling hired out and losing contact with the company once placed at a client."}, {"theme": "Working across locations", "mentions": 4, "of": 56, "tone": "mixed", "promise": "Global community of experts (Lithuania-relocation ad); global teams (YouTube story)", "match": "mixed", "note": "Answers value colleagues in other regions. Others ask for more communication with remote workers and more links between locations."}], "caveat": "The answers are undated, so the period is unknown. The platform chose which answers to show, under paired positive and critical questions, so the tone split partly reflects the question design. One answer can touch several themes. Glassdoor, Indeed and kununu could not be read."}, "manual_import": [{"platform": "LinkedIn: EPAM Systems", "url": "https://www.linkedin.com/company/epam-systems", "capture": ["profile header with description and follower count", "the Life tab, every section", "3–5 recent posts about people, work or hiring, opened with their captions", "pinned posts"]}, {"platform": "Instagram: epamsystems", "url": "https://www.instagram.com/epamsystems", "capture": ["profile header with bio and follower count", "grid of the latest 9–12 posts", "3–5 recent people or hiring posts with captions"]}, {"platform": "Facebook: EPAM Global", "url": "https://www.facebook.com/EPAM.Global", "capture": ["page header", "3–5 recent people or hiring posts with captions"]}, {"platform": "X: EPAMSystems", "url": "https://twitter.com/EPAMSystems/", "capture": ["profile header", "recent posts about careers or people"]}, {"platform": "Glassdoor: EPAM Systems", "url": "https://www.glassdoor.com/Reviews/EPAM-Systems-Reviews-E15544.htm", "capture": ["rating page with the number of reviews and the date", "20–30 recent reviews from the last 24 months"]}, {"platform": "Indeed and kununu", "url": "https://www.indeed.com/cmp/Epam-Systems/reviews", "capture": ["rating page with review count and date", "recent reviews"]}, {"platform": "epam.com careers pages", "url": "https://www.epam.com/careers", "capture": ["careers home page", "culture and benefits pages", "3–6 employee stories", "any “how we hire” page"]}, {"platform": "EPAM Romania (optional)", "url": "https://www.instagram.com/epam_romania/", "capture": ["profile header", "recent people or hiring posts"]}], "scope": {"reviewed": ["careers.epam.com: the landing page (navigation only) and the contact page", "10 job ads across engineering, QA, security, delivery management, consulting, ERP, sales and internal staffing, in Argentina, Hungary, Romania, Poland, Sweden, Belarus, Saudi Arabia (with relocation to Lithuania), India and Armenia", "YouTube channel @EPAMSystemsGlobal: the latest 15 videos", "Comparably: rating and 56 short review answers, as a separate perception layer that does not affect the score"], "not_reviewed": ["epam.com careers home, culture, benefits, careers blog and employee stories (blocked by a bot check)", "the careers.epam.com job list and the referral, relocation and hiring-locations pages", "the contents of the location-specific benefits selector in five ads", "LinkedIn, Instagram, Facebook and X (closed platforms; see the manual-import list)", "Glassdoor, Indeed and kununu (closed or blocked); no official Telegram or VK account found", "other brands (EPAM Continuum, TEST IO, Reliable AI Lab) and language versions of the careers site", "the interview process itself and what candidates experience in it"]}, "summary": {"points": ["The ads show the work: seven of ten describe concrete systems, tools and hand-offs, and four put AI tools into the daily duties.", "Only one of ten ads says what EPAM offers in return. Four show neither a benefits section nor a benefits selector; five have a location selector whose contents did not load in the capture.", "Where promises appear, they use stock phrases, superlatives and client counts. The most specific material (AI-native delivery pods, spec-driven development, named tools) sits in the duties and is never used as a reason to join.", "On YouTube, 5 of the 15 latest videos are about people or hiring. They lean on awards and culture adjectives; the one employee story is told in the company’s words.", "Reviews (not scored): colleagues and learning are mostly positive; pay, management and the offer stage of hiring are mixed. One answer describes a level-up path with a competency matrix that no employer page reviewed mentions."], "actions": ["Add a short, role-specific “why EPAM” block to every ad, starting with the four that have none.", "Rewrite the benefit pillars from the specifics already in the ads, and drop the superlatives.", "Publish what happens after someone applies and how progression works."]}, "dimensions": [{"id": "clarity", "score": 3, "max": 12, "assessable": true, "why": "Two of the four criteria could be assessed (6 points): the pages where an overall offer would normally sit did not load. In what was read, the candidate’s side appears in one ad’s benefits list and one paragraph on the contact page. The benefits copy uses terms it does not explain.", "criteria": [{"name": "Offer clear at a glance", "score": 0, "max": 4, "assessable": false, "note": "The careers home and the epam.com careers pages, where an overall offer would sit, could not be read."}, {"name": "What the candidate gets", "score": 2, "max": 4, "assessable": true, "note": "One ad lists concrete benefits in the candidate’s terms; the contact page promises benefits in general terms; the other nine ads describe duties and requirements only."}, {"name": "One lead message with support beneath it", "score": 0, "max": 2, "assessable": false, "note": "Needs the careers home or an EVP page, which could not be read."}, {"name": "Plain language", "score": 1, "max": 2, "assessable": true, "note": "The benefits copy uses LSHC and “T-shaped professional” without explanation; the security ad’s opening uses GHCP, and GitHub Copilot is only named further down."}]}, {"id": "differentiation", "score": 8, "max": 16, "assessable": true, "why": "None of the six main claims tested becomes untrue for a similar employer. The two closest use EPAM’s own figures (55+ countries, 340+ Forbes Global 2000 clients) but say nothing about the role. The most employer-specific material sits in the duties and is never offered as a reason to join.", "criteria": [{"name": "Only true of you", "score": 2, "max": 5, "assessable": true, "note": "No main claim breaks under substitution; the client and country figures would only need a different number. Employer-tied detail appears in duties (AI-native delivery pods, spec-driven development)."}, {"name": "Free of stock phrases", "score": 2, "max": 3, "assessable": true, "note": "Promises lean on innovative, cutting-edge, world-class and dynamic, but in seven of the ten ads the specific duty text outweighs them."}, {"name": "Uses what is specific to you", "score": 2, "max": 4, "assessable": true, "note": "Specifics exist (AI-native pods, a stock purchase plan with a 15% discount, offices in Vilnius and Kaunas, relocation to Lithuania); few are connected to the offer."}, {"name": "Hard for others to copy", "score": 1, "max": 2, "assessable": true, "note": "Client and footprint figures rest on EPAM’s own business but carry no meaning for the employee; delivery practices are not framed as a promise."}, {"name": "A memorable idea", "score": 1, "max": 2, "assessable": true, "note": "AI-native work appears in two ads and the channel description, but not as an idea about working at EPAM; no line repeats across touchpoints."}]}, {"id": "proof", "score": 9, "max": 16, "assessable": true, "why": "Eight claims were found. Three are partly supported: technology and AI work, learning, and engineering practice, each backed by duty text or one benefits list rather than next to the promise. Global community, client quality, collaborative culture and the awards claim are weakly supported, and the entrepreneurial-culture claim is not supported.", "criteria": [{"name": "How many claims are backed", "score": 3, "max": 6, "assessable": true, "note": "Three of eight claims partly supported, none fully; four of the seven main claims have only weak support."}, {"name": "How specific the backing is", "score": 2, "max": 4, "assessable": true, "note": "A minority of claims are backed, though that backing is specific: named tools, platforms and practices."}, {"name": "Whether the backing fits the claim", "score": 2, "max": 3, "assessable": true, "note": "Support fits some claims at a narrower scope: one role’s duties or one location’s benefits behind company-wide promises."}, {"name": "Proof next to the promise", "score": 2, "max": 3, "assessable": true, "note": "In the one ad that makes promises, the backing sits further down the same page, in the duties or a second benefits list."}]}, {"id": "audience_fit", "score": 8, "max": 12, "assessable": true, "why": "Each ad names role, seniority, location and work mode, and engineers get detailed technical content. Sales, ERP, network and security candidates get no reasons to join. The one benefits block sits in an AI engineering ad but talks about life-sciences expertise the role text never mentions.", "criteria": [{"name": "Clear who it is for", "score": 2, "max": 3, "assessable": true, "note": "Ads are unmistakable; the YouTube channel speaks mainly to clients."}, {"name": "Covers what matters for that audience", "score": 3, "max": 4, "assessable": true, "note": "Technical problems, tools, work mode and location are specific; pay and progression do not appear in the captured text."}, {"name": "Adapted for different audiences", "score": 2, "max": 3, "assessable": true, "note": "Duty content is adapted by role; no shared employer core is carried across, and non-engineering ads get no reasons to join."}, {"name": "Real choices", "score": 1, "max": 2, "assessable": true, "note": "Demands appear as requirements (time pressure, travel, C2 English) rather than as stated choices in the offer."}]}, {"id": "employee_truth", "score": 6, "max": 10, "assessable": true, "why": "The ads show the work: systems, tools, hand-offs and metrics. A few name the hard parts, such as remediating vulnerabilities mainly in legacy applications under time pressure. Culture in the social posts is described with adjectives. Employee voice was not assessed because the employee-story pages could not be read.", "criteria": [{"name": "Employee voice", "score": 0, "max": 3, "assessable": false, "note": "Employee-story pages on epam.com were blocked; only one story video description was readable."}, {"name": "What the work looks like", "score": 3, "max": 3, "assessable": true, "note": "Concrete tasks, tools and set-up in seven of ten ads, for example the network ad’s Cisco ACI fabric, F5 migrations and Terraform and Ansible pipelines."}, {"name": "Difficulties named", "score": 2, "max": 2, "assessable": true, "note": "The security ad names legacy applications and time pressure and says how the work is handled; the network ad names aggressive CVE patch timelines."}, {"name": "Culture shown through practice", "score": 1, "max": 2, "assessable": true, "note": "Practices appear in duties (code reviews, mentoring juniors, test-driven development); culture statements in social posts are adjective lists."}]}, {"id": "consistency", "score": 6, "max": 12, "assessable": true, "why": "Growth, engineering excellence and collaboration appear both in the one benefits block and in the YouTube people posts, but nine of ten ads carry no employer promise. Inside the ad that has benefits, four pillars are written twice in different words, and the location label points to Saudi Arabia while the title and benefits point to Lithuania.", "criteria": [{"name": "Same core promise", "score": 2, "max": 5, "assessable": true, "note": "The promise appears in one ad and partly in social posts; the other nine ads do not refer to it."}, {"name": "Proof tells the same story", "score": 2, "max": 3, "assessable": true, "note": "AI duties in the ads support the AI story; most YouTube proof is client case material."}, {"name": "Same voice", "score": 1, "max": 2, "assessable": true, "note": "Ad openings range from plain technical description to stock phrasing (the Java and tester ads); the benefits block uses two voices for the same pillars."}, {"name": "No contradictions", "score": 1, "max": 2, "assessable": true, "note": "An ambiguity rather than a contradiction: the Lithuania-relocation ad’s location label against its relocation wording."}]}, {"id": "candidate_relevance", "score": 8, "max": 12, "assessable": true, "why": "Work mode and country are on every ad, and the English level on nine of ten. Pay does not appear in the captured text of any ad. Benefits appear in one ad; five others have a benefits selector whose contents did not load. Reasons to join, where given, are general.", "criteria": [{"name": "Why join", "score": 2, "max": 3, "assessable": true, "note": "Reasons appear (the benefits block, the contact page, a line in the Java ad about growing AI expertise) but are general."}, {"name": "What the role involves", "score": 2, "max": 3, "assessable": true, "note": "Duties are concrete in seven of ten ads; client, industry and team size are mostly unnamed, and the Java ad has no duties section."}, {"name": "Facts needed to decide", "score": 2, "max": 3, "assessable": true, "note": "Work mode, country and English level present; pay, contract type and progression absent from the captured text."}, {"name": "Questions anticipated", "score": 2, "max": 3, "assessable": true, "note": "Required and nice-to-have skills are separated, but in the Java ad the two lists say nearly the same thing."}]}, {"id": "conversion", "score": 6, "max": 10, "assessable": true, "why": "Every ad has an apply button and a second route for candidates still looking: send a CV for a personalized offer. Nothing describes what happens after applying, and the contact page offers process information only on request.", "criteria": [{"name": "Next step", "score": 2, "max": 3, "assessable": true, "note": "Apply button on every ad, with nothing on what applying involves."}, {"name": "Reasons close to the button", "score": 1, "max": 2, "assessable": true, "note": "Location, work mode and skill tags sit next to the button; benefits do not."}, {"name": "Effort explained", "score": 1, "max": 2, "assessable": true, "note": "The send-your-CV route saves searching; time and documents needed are not stated."}, {"name": "Right call to action", "score": 2, "max": 2, "assessable": true, "note": "Two routes for two stages: apply for ready candidates, “Find me a job” for those still looking."}, {"name": "Process described", "score": 0, "max": 1, "assessable": true, "note": "No steps, timing or feedback described on any page read."}]}], "strengths": [{"title": "The ads show the actual work", "text": "Seven of the ten ads describe concrete duties, systems and tools. The network ad names the Cisco ACI fabric, F5 BIG-IP migrations and Terraform and Ansible pipelines. The full-stack ad names FastAPI, Pandas, Polars, DuckDB and Azure Container Apps. The delivery-manager ad names the metrics the role tracks: throughput, lead time, quality gates."}, {"title": "AI work appears as duties", "text": "Four ads put AI tools into the daily work: driving spec-driven development and AI-assisted workflows, pairing with GitHub Copilot on vulnerability triage, building agentic systems with evals and observability, and using GitHub Copilot and Claude in spec-driven workflows. Two more ask for AI familiarity. This is the best-supported claim in the material, and the support sits in the duties."}, {"title": "Some ads name the hard parts", "text": "The security ad says the vulnerabilities are mainly in legacy applications, asks for comfort working against a backlog under time pressure, and explains how the work runs: pairing with Copilot, re-scanning until findings close, feeding root causes back to the lead. The network ad mentions aggressive CVE patch timelines; the SAP ad asks for flexibility to travel."}, {"title": "Basic conditions and two ways in", "text": "Every ad states work mode and country, and nine of ten state the English level. Next to the apply button, each ad offers a second route for candidates still looking: send a CV to receive a personalized offer."}], "problems": [{"severity": "high", "title": "Nine of ten job ads give no reason to choose EPAM in the captured text", "evidence": ["One ad, Principal Forward Deployed Engineer, has a benefits section. Five ads show a “Location-specific conditions & benefits” selector whose contents did not load. The security, network, sales and SAP ads show neither.", "The only site-level offer, on the contact page: “We’re offering many benefits across the globe. Browse through our open positions, apply for the one that fits you best and make the most of your work with the benefits of an enterprise-level company.”"], "why": "A reader of the security, network, sales or SAP ad learns what the work is and nothing about what EPAM offers in return. The promises made in the one benefits block and in the YouTube people posts do not reach the other ads.", "flags": ["RF23"]}, {"severity": "high", "title": "The promises use stock phrases while the specifics sit unused in the duties", "evidence": ["“Advanced Tech Stack: Work on innovative projects and apply or enhance your expertise in Cloud, Data, AI and other emerging technologies.” (Lithuania-relocation ad)", "The same ad’s duties: build agentic systems, write production Python, stand up evals and observability, design for failure in the agent loop.", "“EPAM is renowned for delivering cutting-edge technological solutions to transform businesses worldwide.” (same ad)", "Ad openings: the tester ad offers room to “stay at the forefront” of quality engineering; the staffing ad offers “a dynamic environment”."], "why": "None of the six main claims tested is specific to EPAM. The ads already contain what would make them specific: AI-native delivery pods, spec-driven development, named tools, legacy remediation with Copilot. That material is never offered as a reason to join.", "flags": ["RF01", "RF15"]}, {"severity": "medium", "title": "Client and footprint figures say nothing about the role", "evidence": ["“World-Class Clients: Work closely with 340+ of the Forbes Global 2000 on creating disruptive solutions that make a global impact”", "“Industry Leadership: Join the company recognized globally as a leader in Life Sciences and technology, with 12 of the top 15 Life Science companies relying on us.”"], "why": "The figures are specific, but the ad does not say which client or industry the engineer would work for, and its duties and requirements do not mention life sciences. “Work closely with 340+” describes the company’s client base, not the role.", "flags": ["RF22"]}, {"severity": "medium", "title": "The growth promise lists inputs, not a path", "evidence": ["“Professional Growth: Exceptional support for career development with comprehensive resources for upskilling or reskilling in pioneering practices”", "Inputs named in the same ad: in-house training, mentorship, access to LinkedIn Learning and Udemy."], "why": "No levels, no description of how someone moves up, no outcome figures. The list appears in one ad tied to Lithuania, and the material does not say whether it holds in other hiring countries.", "flags": ["RF14"]}, {"severity": "medium", "title": "The only benefits block repeats itself and leaves the location unclear", "evidence": ["Four pillars (Advanced Tech Stack, World-Class Clients, Professional Growth, Hybrid Setup) appear twice, in two lists with different wording.", "Location label: “Hybrid in Saudi Arabia: Al Khobar”. Opening line: “We are looking for a Principal Forward Deployed Engineer to join our team with eventual relocation to Lithuania.” The benefits offer flexibility to work from anywhere in Lithuania.", "The benefits speak of becoming a T-shaped professional with deep LSHC expertise; the role’s duties and requirements do not mention life sciences."], "why": "The ad does not say where the hire works before relocation or when the move happens, and its benefits block reads as written for a different specialism.", "flags": []}, {"severity": "medium", "title": "The YouTube channel speaks mostly to clients, and its people posts rely on awards and adjectives", "evidence": ["10 of the 15 latest videos are client, product or partner content.", "“These honors reflect EPAM’s commitment to engineering excellence and innovation, a dynamic, collaborative and inclusive culture, and continuous learning and professional growth.”", "“Along the way, we built a culture rooted in care, collaboration and strong community.” (EPAM Croatia)"], "why": "All five people posts link to jobs. But culture is described through adjectives and awards whose criteria are not given, and the one employee story is told in the company’s words in the description.", "flags": ["RF07"]}, {"severity": "medium", "title": "Nothing says what happens after applying", "evidence": ["Contact page: “Have any questions or queries? Want get more information about our process? Get in touch with us. Our support team is always happy to help.”", "No ad describes steps, interviews, timing or feedback."], "why": "The steps and duration of the process are not visible without writing in. In the review answers read, the hiring stage draws both praise and complaints.", "flags": ["RF20"]}, {"severity": "low", "title": "Copy slips in the Java ad and on the contact page", "evidence": ["Java ad, required: “At least three years of relevant hands-on practice in professional software engineering”. Nice to have: “No fewer than three years of experience in a comparable software engineering position”. The two lists repeat each other item by item.", "Contact page: “Want get more information about our process?”"], "why": "The Java ad does not make clear which skills are firm. The contact-page line has a grammar error on the page used for candidate questions.", "flags": []}], "fixes": [{"title": "Add a short, role-specific “why EPAM” block to every job ad, starting with the four that have none", "needs_new_data": true, "steps": ["Add four to six lines after the duties of each ad: what the role offers, which client or industry it serves where that can be named, how learning works, and the benefits for that location.", "Start with the security, network, sales and SAP ads, which show neither a benefits section nor a benefits selector.", "Check whether the benefits behind the location selector in the other five ads are readable as page text; in this capture they did not load."], "why_first": "It reaches every candidate at the point of decision, and part of the content already exists in the one benefits list.", "needs": ["benefits for each hiring country", "pay range or pay logic per role, if you decide to publish it", "client industry per role, where it can be named"], "effort": "medium", "effort_note": "a template block plus facts from each country’s HR team", "who": ["talent acquisition", "country HR (benefits)", "delivery leads (client context)"], "check": ["the share of live ads with a why-join block", "whether candidates ask about benefits and pay at the first call"]}, {"title": "Rewrite the benefit pillars from the specifics already in your ads and drop the superlatives", "needs_new_data": false, "steps": ["Replace “Advanced Tech Stack” with what the role builds and with which tools, taken from its duties.", "Replace “Best-in-class”, “top professionals”, “Exceptional support” and “World-Class Clients” with the underlying fact, or remove them.", " d already says what the role builds.", "logic": "Uses only this ad’s own duties, scoped to this role.", "rewrite": "What you build in this role: you and your team build agentic systems. You design, build and ship end-to-end AI-native systems, including agents, workflows, RAG and integration harnesses, write production-grade Python, build evaluation pipelines, and design for failure in the agent loop with retries, model fallbacks, cost limits and human-in-the-loop actions.", "notes": [{"kind": "evidence", "text": "Which client domain the role works in, if it can be named."}]}, {"title": "Lithuania-relocation ad: the “Professional Growth” pillar", "original": "Professional Growth: Exceptional support for career development with comprehensive resources for upskilling or reskilling in pioneering practices", "problem": "A superlative with no path or outcome. The concrete inputs sit in a separate list further down the same ad.", "logic": "Keeps only the inputs this ad names and leaves the path as information needed.", "rewrite": "Learning: in-house training and mentorship, plus access to external educational platforms, including LinkedIn Learning and Udemy.", "notes": [{"kind": "evidence", "text": "How progression works: the levels, what moves someone up, how many people moved up last year."}, {"kind": "confirm", "text": "Whether these learning benefits apply in every hiring country or only to this role."}]}, {"title": "Senior Java Developer ad: the opening paragraph", "original": "We invite an experienced Senior Java Developer with practical AI knowledge to strengthen our technology organization. You will work on complex engineering initiatives where innovation, system reliability, and collaboration are central to success. Our environment encourages continuous improvement, technical depth, and the purposeful adoption of modern tools. The position offers meaningful scope to create scalable software while growing your expertise in artificial intelligence", "problem": "Four const na = x.assessable === false;
const pct = na ? 0 : Math.round(100 * (x.score || 0) / (x.max || 1));
return `<div class="dim"><div><div class="name">${esc(meta[0])}</div><div class="desc">${esc(meta[1])}</div></div>
<div><div class="bar"><i style="width:${pct}%"></i></div><div class="why">${txt(x.why)}</div></div>
<div class="pts">${na ? `<small>${esc(T.not_assessable)}</small>` : `${esc(x.score)}<small>/${esc(x.max)}</small>`}</div></div>`;
}).join('')}</div>`);
}
// what works
h += sec('working', T.sec_working, (d.strengths || []).length ? `<div class="cards">${d.strengths.map(x => `<div class="card good"><h3>${esc(x.title)}</h3><p>${txt(x.text)}</p></div>`).join('')}</div>` : '');
// problems
h += sec('problems', T.sec_problems, (d.problems || []).length ? `<div class="cards">${d.problems.map(x => `<div class="card sev-${esc(x.severity)}">
<div class="sev">${esc(T.severity[x.severity] || '')}</div><h3>${esc(x.title)}</h3>
${(x.evidence || []).length ? `<div class="lbl">${esc(T.evidence)}</div>${x.evidence.map(e => `<blockquote>${txt(e)}</blockquote>`).join('')}` : ''}
${x.why ? `<div class="lbl">${esc(T.why_matters)}</div><p>${txt(x.why)}</p>` : ''}
${(x.flags || []).length ? `<div class="lbl">${esc(T.flags)}</div><p class="muted">${x.flags.map(f => esc((T.rf && T.rf[f]) || f)).join(' · ')}</p>` : ''}</div>`).join('')}</div>` : '');
// social media
if ((d.social || []).length) {
h += sec('social', T.sec_social, `<div class="tblwrap"><table><tr>${T.soc_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.social.map(x => `<tr>
<td>${esc(x.platform)}</td><td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.account || x.url)}</a>` : esc(x.account)}</td>
<td>${txt(x.purpose)}</td><td>${txt(x.sample)}</td><td>${txt(x.rhythm)}</td><td>${txt(x.people_share)}</td>
<td>${(x.themes || []).length ? list(x.themes) : ''}${x.notes ? `<p class="muted">${txt(x.notes)}</p>` : ''}</td></tr>`).join('')}</table></div>`);
}
// perception layer (reviews), never part of the score
const pr = d.perception || {};
if ((pr.themes || []).length || (pr.sample || []).length) {
let ph = `<div class="notice">${esc(T.per_note)}${pr.caveat ? ' ' + txt(pr.caveat) : ''}</div>`;
if ((pr.sample || []).length) {
ph += `<h3>${esc(T.per_sample)}</h3><div class="tblwrap"><table><tr>${T.per_sample_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.sample.map(x => `<tr><td>${esc(x.platform)}</td><td>${esc(x.reviews)}</td><td>${esc(x.period)}</td><td>${txt(x.rating)}</td></tr>`).join('')}</table></div>`;
}
if (pr.thin) ph += `<p class="muted">${esc(T.per_thin)}</p>`;
if ((pr.themes || []).length) {
ph += `<div class="tblwrap"><table><tr>${T.per_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${pr.themes.map(x => `<tr>
<td><b>${esc(x.theme)}</b></td><td>${pr.thin || x.mentions == null ? '' : esc(x.mentions) + (x.of ? ' / ' + esc(x.of) : '')}</td>
<td>${chip(T.tone, x.tone)}</td><td>${txt(x.promise)}</td><td>${chip(T.match, x.match)}</td><td>${txt(x.note)}</td></tr>`).join('')}</table></div>`;
}
h += sec('perception', T.sec_perception, ph);
}
// plan
h += sec('plan', T.sec_plan, (d.fixes || []).length ? `<div class="cards fixes">${d.fixes.map(x => `<div class="card fix"><h3>${esc(x.title)}</h3>
<span class="effort ${x.needs_new_data ? 'data' : ''}">${esc(x.needs_new_data ? T.fix_data : T.fix_ready)}</span>
<div class="lbl">${esc(T.fix_where)}</div>${list(x.steps)}
${x.why_first ? `<div class="lbl">${esc(T.fix_why)}</div><p>${txt(x.why_first)}</p>` : ''}
${(x.needs || []).length ? `<div class="lbl">${esc(T.fix_needs)}</div>${list(x.needs)}` : ''}
${x.effort ? `<div class="lbl">${esc(T.effort_lbl)}</div><p>${esc(T.effort[x.effort] || x.effort)}${x.effort_note ? '. ' + txt(x.effort_note) : ''}</p>` : ''}
${(x.who || []).length ? `<div class="lbl">${esc(T.who)}</div><p>${x.who.map(esc).join(', ')}</p>` : ''}
${(x.check || []).length ? `<div class="lbl">${esc(T.check)}</div>${list(x.check)}` : ''}</div>`).join('')}</div>` : '');
// rewrites
h += sec('rewrites', T.sec_rewrites, (d.rewrites || []).length ? `<div class="cards">${d.rewrites.map(x => `<div class="card"><h3>${esc(x.title)}</h3>
${x.problem ? `<div class="lbl">${esc(T.rw_problem)}</div><p>${txt(x.problem)}</p>` : ''}
${x.logic ? `<div class="lbl">${esc(T.rw_logic)}</div><p>${txt(x.logic)}</p>` : ''}
<div class="rw"><div><div class="lbl">${esc(T.rw_original)}</div><div class="before">${txt(x.original)}</div></div>
<div><div class="lbl">${esc(T.rw_rewrite)}</div><div class="after">${txt(x.rewrite)}</div></div></div>
${(x.notes || []).length ? `<ul class="qlist">${x.notes.map(n => `<li><span class="tag ${n.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[n.kind] || n.kind)}</span>${txt(n.text)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>` : '');
// questions
const qs = d.questions || [];
if (qs.length) {
const grp = k => qs.filter(q => (q.for || 'communication') === k);
const qhtml = ['communication', 'audit'].map(k => grp(k).length ? `<h3 style="margin:18px 0 6px">${esc(T.q_for[k])}</h3><ul class="qlist">${grp(k).map(q => `<li><span class="tag ${q.kind === 'confirm' ? 'tag-q' : 'tag-e'}">${esc(T.q_kind[q.kind] || q.kind)}</span>${txt(q.text)}</li>`).join('')}</ul>` : '').join('');
h += sec('questions', T.sec_questions, `<p class="muted">${esc(T.q_note)}</p>${qhtml}`);
}
// manual import checklist
if ((d.manual_import || []).length) {
h += sec('manual', T.sec_manual, `<p class="muted">${esc(T.manual_note)}</p><div class="cards">${d.manual_import.map(x => `<div class="card"><h3>${esc(x.platform)}</h3>
${safeUrl(x.url) ? `<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>` : ''}
${(x.capture || []).length ? `<div class="lbl">${esc(T.manual_capture)}</div>${list(x.capture)}` : ''}</div>`).join('')}</div>`);
}
// appendix
let app2 = '';
if ((d.source_map || []).length) {
app2 += `<h3>${esc(T.app_map)}</h3><div class="tblwrap"><table><tr>${T.map_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.source_map.map(x => `<tr>
<td>${safeUrl(x.url) ? `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>` : esc(x.source)}</td><td>${esc(x.kind)}</td>
<td>${chip(T.decision, x.decision)}</td><td>${txt(x.reason)}</td></tr>`).join('')}</table></div>`;
}
if ((d.genericity || []).length) {
app2 += `<h3>${esc(T.app_genericity)}</h3><div class="tblwrap"><table><tr>${T.gen_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.genericity.map(g => `<tr>
<td>${txt(g.claim)}</td><td>${chip(T.gen.verdict, g.verdict)}</td><td>${chip(T.gen.substitution, g.substitution)}</td><td>${chip(T.gen.ubiquity, g.ubiquity)}</td>
<td>${chip(T.gen.specificity, g.specificity)}</td><td>${chip(T.gen.defensibility, g.defensibility)}</td><td>${txt(g.why)}</td></tr>`).join('')}</table></div>`;
}
if ((d.ledger || []).length) {
app2 += `<h3>${esc(T.app_ledger)}</h3><div class="tblwrap"><table><tr>${T.led_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.ledger.map(l => `<tr>
<td>${txt(l.claim)}</td><td>${esc(T.led.class[l.class] || '')}</td><td>${txt(l.evidence)}</td><td>${chip(T.led.strength, l.strength)}</td>
<td>${chip(T.led.status, l.status)}</td><td>${txt(l.comment)}</td></tr>`).join('')}</table></div>`;
}
const det = (d.dimensions || []).flatMap(x => (x.criteria || []).map(c => [x.id, c]));
if (det.length) {
app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
