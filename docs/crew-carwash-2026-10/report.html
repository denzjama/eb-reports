<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer brand audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16141F;--soft:#5D5A6B;--line:#E4E1EA;--paper:#FBFAF7;--card:#FFFFFF;--accent:#6B3FD4;--accent2:#19B6C9;--hi:#D6455D;--mid:#E39B1A;--lo:#8B8898;--ok:#1F9D6B;--tint:#F2EEFB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Onest,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
h1,h2,h3,h4{line-height:1.15;margin:0}
h2{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:64px 0 20px;padding-top:12px;border-top:3px solid var(--ink)}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0 0 12px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.muted{color:var(--soft)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
/* cover */
.cover{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch;margin-bottom:8px}
.cover-main{background:var(--ink);color:#fff;border-radius:18px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.cover-main:after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent2),var(--accent),#FF5FA2,var(--accent2));filter:blur(60px);opacity:.55}
.cover-main h1{font-size:46px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.cover-main .kicker{color:#C9B8FF;position:relative;z-index:1}
.cover-meta{position:relative;z-index:1;color:#CFCBDC;font-size:15px}
.verdict{font-size:18px;line-height:1.5;font-weight:400;color:#E9E6F2;position:relative;z-index:1;margin:22px 0}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:18px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:132px;height:132px;flex:none}
.ring .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .num small{font-size:20px;color:var(--soft);font-weight:500}
.band{font-size:15px;color:var(--soft);line-height:1.4}
.metric{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.metric b{font-size:17px}
.metric span.h{display:block;color:var(--soft);font-size:13px;line-height:1.35}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.pill.prov{background:#FFF4DC;color:#9A6400}
/* nav */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.toc a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin-bottom:12px}
.actions li{margin:8px 0}
/* howto */
.lead{font-size:19px;line-height:1.5}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.howto-card{background:var(--tint);border-radius:14px;padding:20px}
.howto-card h4{margin-bottom:8px;color:var(--accent)}
.howto-card p{font-size:15.5px;margin:0}
.howto-h{margin:26px 0 8px}
.howto-list li{margin:8px 0}
details.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 24px 20px}
details.howto summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--accent)}
/* scorecard */
.dim{display:grid;grid-template-columns:280px 1fr 70px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .name{font-weight:700}
.dim .desc{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:4px}
.bar{height:14px;background:#EEEBF3;border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dim .why{font-size:15px}
.dim .pts{text-align:right;font-weight:800;font-size:20px}
.dim .pts small{font-size:13px;color:var(--soft);font-weight:500}
/* cards */
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-left:6px solid var(--line)}
.card.sev-critical,.card.sev-high{border-left-color:var(--hi)}
.card.sev-medium{border-left-color:var(--mid)}
.card.sev-low{border-left-color:var(--lo)}
.card.good{border-left-color:var(--ok)}
.card h3{margin:6px 0 10px}
.sev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sev-critical .sev,.sev-high .sev{color:var(--hi)}.sev-medium .sev{color:#B07400}.sev-low .sev{color:var(--lo)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
blockquote{margin:6px 0;padding:10px 14px;background:#F7F5FA;border-radius:10px;font-size:15.5px}
.fix{counter-increment:fix}
.fix h3:before{content:counter(fix);display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;margin-right:12px;font-size:17px}
.cards.fixes{counter-reset:fix}
.effort{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#E8F7F0;color:#13734E}
.effort.data{background:#FFF4DC;color:#9A6400}
/* rewrites */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rw .before{background:#F7F5FA;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
.rw .after{background:#EFFAF5;border:1px solid #CBEBDD;border-radius:12px;padding:16px;font-size:15.5px;white-space:pre-line}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;margin-right:6px;vertical-align:1px}
.tag-q{background:#E6F6F8;color:#0E7C8A}.tag-e{background:#FFF4DC;color:#9A6400}
.qlist{list-style:none;padding:0}
.qlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F4F2F8;text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:#F1EFF5;white-space:nowrap}
.chip.g{background:#E8F7F0;color:#13734E}.chip.m{background:#FFF4DC;color:#9A6400}.chip.r{background:#FDE8EC;color:#B3263E}
.tblwrap{overflow-x:auto;margin:10px 0 26px}
.notice{background:#FFF4DC;border-radius:12px;padding:14px 18px;margin:18px 0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:15px}
.scope h4{margin-bottom:6px}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.printbtn{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:600 14px Onest,Arial,sans-serif;cursor:pointer}
@media (max-width:820px){.scope,.cover,.summary,.howto-grid,.rw{grid-template-columns:1fr}.dim{grid-template-columns:1fr}.dim .pts{text-align:left}.cover-main h1{font-size:34px}}
@media print{#summary + .summary{break-after:page}body{background:#fff;font-size:12pt}.wrap{max-width:none;padding:0}.printbtn,.toc{display:none}h2{break-after:avoid}.card,.dim,.panel,table,.rw{break-inside:avoid}details.howto{border:0;padding:0}.cover-main{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

the material.", "The reasons to choose Crew are a Glassdoor ranking, “Industry-leading training”, “full potential” and a fun team. None of the material explains what the ranking was based on. Only training comes with any substance: the careers page lists what the training covers.", "Growth is promised in every ad and in the June 2026 press release, but no page shows where a customer service job or the Fast Track Manager role leads, or how many people have made that move.", "The best proof sits in the wrong place. The careers page lists leadership training, including running a business and manager coaching. The Fast Track Manager ad, the one role where this matters most, says only “Industry-leading training”.", "Old and current pages disagree on details. A Maple Grove page last changed in December 2022 offers a sign-on bonus, tuition help of up to $3,500 a year and applications through a different system. Current pages mention none of these."], "actions": ["Publish the growth path from associate to Fast Track Manager and beyond, with real numbers.", "Replace “Industry-leading training” and the bare award claim with what the training covers and what the ranking measured.", "Update or remove the 2022 Maple Grove page, and spell out what “Flexible schedules” means for each role."]}, "dimensions": [{"id": "clarity", "score": 7, "max": 12, "assessable": true, "why": "A candidate can piece together the offer: an entry-level job from $15 an hour with incentives, flexible schedules and training. It arrives as a list of benefits, not one idea. Each ad opens with the customer purpose and closes with company history, and phrases such as “WOW! Customers” go unexplained.", "criteria": [{"name": "Offer identifiable", "score": 2, "max": 4, "assessable": true, "note": "The offer has to be pieced together from benefit lists on the role page and in the ads. No single idea connects them."}, {"name": "Candidate benefit explicit", "score": 3, "max": 4, "assessable": true, "note": "The ads have a section listing Crew's commitments to you, with concrete items. About a third of each ad is company history."}, {"name": "Message hierarchy", "score": 1, "max": 2, "assessable": true, "note": "The customer purpose, the Glassdoor ranking and full potential compete for first place."}, {"name": "Plain language", "score": 1, "max": 2, "assessable": true, "note": "“WOW! Customers”, “Service advise and load customers”, WIT and Unlimited plans are not explained in the ads."}]}, {"id": "differentiation", "score": 8, "max": 16, "assessable": true, "why": "Only the 2026 Glassdoor ranking and the founder's line tie the message to Crew. Training and full potential could be published unchanged by a comparable car wash employer. Stock phrases carry most of the reasons to join.", "criteria": [{"name": "Fits only this employer", "score": 3, "max": 5, "assessable": true, "note": "The #1 ranking for 2026 cannot be reused by another employer, and the founder's line only partly can. The training and full potential claims fit anyone in the category."}, {"name": "Avoids stock phrases", "score": 1, "max": 3, "assessable": true, "note": "Full potential, industry-leading training, incredible growth potential, fast-paced and fun team carry the case for joining."}, {"name": "Uses what is specific to the employer", "score": 2, "max": 4, "assessable": true, "note": "The training curriculum and daily pay are specific. Family ownership since 1948 is told as history, without saying what it means for staff."}, {"name": "Hard to copy", "score": 1, "max": 2, "assessable": true, "note": "The ranking is tied to one year. Nothing structural backs the other promises."}, {"name": "Memorable idea", "score": 1, "max": 2, "assessable": true, "note": "The founder's line about being in the people business is memorable, but no page shows what it means for the work."}]}, {"id": "proof", "score": 8, "max": 16, "assessable": true, "why": "Two of six promises have meaningful support: training, through the curriculum on the careers page, and flexible schedules, through the schedule options shown. The Glassdoor ranking, growth, the people-first culture and the team member promise rest on the claims themselves, short quotes or company growth.", "criteria": [{"name": "How many promises are supported", "score": 2, "max": 6, "assessable": true, "note": "Training (a central promise) and flexible schedules have partial support. Growth, the ranking and culture do not."}, {"name": "Specific evidence", "score": 2, "max": 4, "assessable": true, "note": "The training list and the hours are specific, but they cover only two of six promises."}, {"name": "Evidence fits the promise", "score": 2, "max": 3, "assessable": true, "note": "New locations are offered as a sign of opportunity for staff, but they show company growth, not careers."}, {"name": "Evidence next to the promise", "score": 2, "max": 3, "assessable": true, "note": "The training list sits under its heading on the careers page, but not in the ads that make the training promise."}]}, {"id": "audience_fit", "score": 9, "max": 12, "assessable": true, "why": "Role families are named clearly, and the ads speak to entry-level hourly staff and to manager trainees separately. The proposition itself tries to suit everyone. Maintenance, night clean-up and Support Center roles get one line each on the careers page.", "criteria": [{"name": "Audience defined", "score": 3, "max": 3, "assessable": true, "note": "Customer service associates (16 and over, no experience needed), Fast Track Managers (degree or service-industry management experience) and three other role families are named."}, {"name": "Addresses decision factors", "score": 3, "max": 4, "assessable": true, "note": "Pay, hours, benefits and physical demands are covered. Progression and the size of incentive pay are not."}, {"name": "Adapted by audience", "score": 2, "max": 3, "assessable": true, "note": "The manager ad has its own salary, duties and requirements on the shared template. Other role families are barely described."}, {"name": "Makes real choices", "score": 1, "max": 2, "assessable": true, "note": "Hard demands appear only in the requirements list. The pitch above them appeals to everyone."}]}, {"id": "employee_truth", "score": 7, "max": 10, "assessable": true, "why": "The work itself is described concretely: greeting customers, guiding cars onto the conveyor, standing for up to 8+ hours, weather extremes and moving parts. Employee voice is three short quotes from Indiana associates, two of them adjectives. Culture is a list of values.", "criteria": [{"name": "Employee voice", "score": 2, "max": 3, "assessable": true, "note": "Three associates are quoted by first name. One describes rotating between service advisor, loader and lot checks. The other two speak of a great team and a fun environment."}, {"name": "Work reality", "score": 3, "max": 3, "assessable": true, "note": "Tasks, hours, physical demands and conditions are stated in the ads and on the role page."}, {"name": "Honest about difficulty", "score": 1, "max": 2, "assessable": true, "note": "The demands are named, but only the manager ad says how one of them is handled (training for maintenance work)."}, {"name": "Culture shown through practice", "score": 1, "max": 2, "assessable": true, "note": "Six values are listed without examples. Practices such as daily pay, safety and CPR certification and role rotation appear separately."}]}, {"id": "consistency", "score": 9, "max": 12, "assessable": true, "why": "The ranking, training and flexible schedules recur on almost every page, in the same upbeat voice. The material is consistent, and consistently generic. Smaller tensions remain: flexible schedules next to a five-day rotation for managers, an outdated 2022 page, location lists that leave out Illinois and three different application routes.", "criteria": [{"name": "Same core promise", "score": 4, "max": 5, "assessable": true, "note": "Careers pages, ads and the press release share the same promises. The story page and FAQ do not touch them."}, {"name": "Proof tells the same story", "score": 2, "max": 3, "assessable": true, "note": "The press release offers equipment and water reclamation details, which are customer facts and off the employee story."}, {"name": "Same voice", "score": 2, "max": 2, "assessable": true, "note": "All touchpoints share the same upbeat, customer-service voice."}, {"name": "No contradictions", "score": 1, "max": 2, "assessable": true, "note": "No direct contradiction was found, but there are several unresolved tensions (see main problems)."}]}, {"id": "candidate_relevance", "score": 8, "max": 12, "assessable": true, "why": "Pay, location, hours and the full-time-only conditions are stated plainly. What is missing is where the job leads, how incentive pay works and what flexible means in practice. The FAQ answers basic process questions.", "criteria": [{"name": "Why join", "score": 2, "max": 3, "assessable": true, "note": "Reasons are given, but they are a ranking and generic phrases."}, {"name": "Role reality", "score": 2, "max": 3, "assessable": true, "note": "Tasks and conditions are concrete. Team set-up and who you report to are not described."}, {"name": "Decision facts", "score": 2, "max": 3, "assessable": true, "note": "Pay and hours are present. Progression, incentive pay amounts and tuition reimbursement amounts on current pages are not."}, {"name": "Anticipates doubts", "score": 2, "max": 3, "assessable": true, "note": "No experience needed, minimum age and a 2–3 day review time are covered. Questions about growth and flexibility are left open."}]}, {"id": "conversion", "score": 8, "max": 10, "assessable": true, "why": "Each role family on the careers page has its own apply link, and the role page puts an apply button right after pay and benefits. The FAQ says applications are typically reviewed within 2–3 days. The application route differs between pages, and nothing says how long applying takes.", "criteria": [{"name": "Next step clear", "score": 2, "max": 3, "assessable": true, "note": "Buttons lead to an application chat. The 2022 page links to a different system and the FAQ to an online portal."}, {"name": "Reasons near the button", "score": 2, "max": 2, "assessable": true, "note": "On the role page the apply button follows the pay and benefits grid."}, {"name": "Effort explained", "score": 1, "max": 2, "assessable": true, "note": "No experience required is stated. Time to apply and what to prepare are not."}, {"name": "Button fits the audience", "score": 2, "max": 2, "assessable": true, "note": "There are role-specific apply links, and a separate option to see what is open nearby."}, {"name": "Process explained", "score": 1, "max": 1, "assessable": true, "note": "The FAQ says applications are typically reviewed within 2–3 days and a recruiter gets in touch if there is interest."}]}], "strengths": [{"title": "The ads state hard facts, with their conditions", "text": "The customer service ads give “$15 - $16 per hour + incentive pay”, daily pay options at no cost, and paid time off plus 6 paid holidays marked as full-time only. They also give minimum hours of 10 a week part-time and 30 full-time (20 part-time for the daytime role). The manager ad gives a salary range of $45,000 to $60,000 plus incentive pay. Conditions such as full-time only are kept next to the benefit they limit."}, {"title": "The physical reality of the job is stated plainly", "text": "Every ad lists standing for up to 8+ hours a day, working near moving mechanical parts, climbing ladders and scaffolds, lifting at least 25 pounds and “Be able to withstand extended exposure to all weather extremes”. A candidate can judge fit before applying."}, {"title": "The customer service job is described as it is done", "text": "The Indiana role page explains the two parts of the job: advising customers on wash options and directing vehicles onto the conveyor. One associate describes a shift rotating between service advisor, loader and lot checks."}, {"title": "Training has content", "text": "The careers page lists what the training covers at no cost: hands-on management, customer service and sales, car wash technical skills, leadership, running a business, manager coaching, and safety and CPR certifications. It is one of the two promises in the material with meaningful support."}, {"title": "A low barrier to entry, said clearly", "text": "The ads say no prior work experience is required and the minimum age is 16. The FAQ says applications are typically reviewed within 2–3 days."}], "problems": [{"severity": "high", "title": "Growth is promised everywhere and shown nowhere.", "evidence": ["Every ad promises the chance to achieve your full potential; the manager ad lists “Incredible growth potential” among Crew's commitments.", "June 2026 press release, Sally Grant: “Our continued growth creates even more opportunities for our team members and a greater impact in the communities we serve.”", "The role is called Fast Track Manager and, in the ad text, Fast-Track Manager in Training, but no page says what the track leads to or how long it takes.", "No page gives a route from customer service associate to manager, or any figure on internal promotion."], "why": "Growth is the most repeated promise after the award, and the only evidence offered is new locations. New locations show the company is growing; they say nothing about what happens to a person's job. For the Fast Track Manager role the missing path is the missing core of the offer.", "flags": ["RF14"]}, {"severity": "high", "title": "The reasons to join rest on a ranking and stock phrases whose basis is not shown.", "evidence": ["“Recognized as one of Glassdoor’s Best Places to Work for multiple years and ranked #1 in the nation in 2026, Crew Carwash is dedicated to creating a positive and fast-paced work environment.” (press release)", "The Indiana role page leads its culture section with the #1 Best Place to Work claim; every ad says you will join a Glassdoor Best Places to Work.", "“Industry-leading training” appears in all three ads; the Maple Grove page description promises “award winning training” without naming the award."], "why": "The ranking is specific and dated, but no page says what it measured or what it means for someone washing cars in Greenfield. “Industry-leading” compares Crew with an industry the material never describes. Take these away and what remains is pay, hours and a list of benefits.", "flags": ["RF01", "RF02"]}, {"severity": "medium", "title": "The founder's line is the one memorable idea, and nothing shows what it means.", "evidence": ["Every ad repeats: “We're really in the people business, we just happen to wash cars!”", "The careers page lists values (Safety, Integrity, Teamwork, Fun, Accountability, WIT) with no example of any of them.", "Two of the three associate quotes describe the team only in general terms: a great team, a fun environment and teamwork."], "why": "The line ties back to the founder and to 1948, which no other employer can claim. The material never gives a single practice that makes staff feel Crew is in the people business. Daily pay, role rotation and safety certification are real practices, but they sit elsewhere and are never linked to the line.", "flags": ["RF21"]}, {"severity": "medium", "title": "“Flexible schedules” is never defined, and the manager ad puts it next to a fixed five-day rotation.", "evidence": ["“Flexible schedules” is a commitment in all three ads.", "The same manager ad requires: “Work 5 days per week, including opening, mid, and closing shifts”.", "The daytime ad fixes hours at 7AM to 4PM, Monday to Friday, and also lists flexible schedules."], "why": "The material does not say what can be flexed: days, shift times, or total hours. For the manager role the stated requirement leaves little visible room. A candidate reading this may reasonably ask which of the two statements describes the job.", "flags": ["RF06"]}, {"severity": "medium", "title": "An outdated page and mismatched details make it unclear what is current.", "evidence": ["The Maple Grove hiring page, last changed in December 2022 and still public, gives starting pay of $16–18 an hour, a $600 sign-on bonus, tuition help of up to $3,500 a year and loan payback help, with applications through Paycor.", "Current pages send applicants to an application chat; the FAQ refers to an online portal.", "The ad text says Crew has opened multiple locations throughout Indiana and Minnesota, and the FAQ also names only Indiana and Minnesota. The June 2026 press release and the story page include Illinois.", "The tuition reimbursement in the current ads and on the careers page has no amount."], "why": "The most generous figures in the public material (bonus, tuition amount, loan help) appear only on the oldest page. It is unclear whether they still apply, in Minnesota or anywhere else.", "flags": []}, {"severity": "low", "title": "Internal phrases go unexplained in the ads.", "evidence": ["“WOW! Customers”, “Service advise and load customers” and “Help maintain a park-like environment (inside and outside)” appear in the duties lists.", "WIT appears among the values on the careers page, spelled out only there."], "why": "The ads do not explain these terms. The role page does explain advising and loading, but the ads do not link to it.", "flags": ["RF19"]}], "fixes": [{"title": "Show where the job leads, with numbers", "needs_new_data": true, "steps": ["Add a short growth path to the careers page and the Fast Track Manager ad: the steps from associate to Fast Track Manager to the roles above it.", "Say what Fast Track means: how long the in-training phase lasts and what role it leads to.", "Add one or two figures, such as how many current managers started as associates.", "Then remove or replace “Incredible growth potential” and “achieve your full potential”."], "why_first": "Growth is the most repeated promise without support, and it is the core of the Fast Track Manager offer.", "needs": ["Internal promotion figures for managers", "Length and end point of the Fast Track programme", "Two or three real progression stories, with names and roles, from people who agree to be featured"], "effort": "medium", "effort_note": "A few figures from HR and one conversation with operations, then rewriting two pages.", "who": ["HR / talent acquisition (promotion data)", "Operations leaders (Fast Track programme)", "Managers who were promoted internally (stories)"], "check": ["Whether candidates at Fast Track Manager interviews ask what the track leads to", "How many applications the Fast Track Manager ad receives from current associates"]}, {"title": "Replace the superlatives with what the training covers and what the ranking measured", "needs_new_data": false, "steps": ["In every ad, replace “Industry-leading training” with the training content already on the careers page, stated for the roles it actually applies to.", "Next to each mention of the Glassdoor ranking, add one line on what it was based on.", "Remove “award winning training” from the Maple Grove page description unless the award can be named."], "why_first": "The training curriculum is already written. Moving it into the ads replaces an unsupported claim with the best proof in the material at little cost.", "needs": ["Which training topics apply to which roles", "What the Glassdoor ranking measured"], "effort": "small", "effort_note": "Rewording with facts already on the careers page, plus one check with HR.", "who": ["Talent acquisition (ad template)", "HR / learning (training scope)"], "check": ["Whether interview candidates mention specific training topics", "Whether the new wording is carried into the ad template for every city"]}, {"title": "Retire the outdated page and define what is flexible", "needs_new_data": true, "steps": ["Update or remove the 2022 Maple Grove hiring page, and make sure its sign-on bonus, tuition and loan-help figures appear only if they are current.", "Use one application route on every page.", "Replace the location sentence in the ad template with the current states.", "For each role, replace “Flexible schedules” with what can actually be chosen: days, shift times or hours."], "why_first": "These fixes are mostly housekeeping, but they settle which offer is real before the new content goes live.", "needs": ["Current Minnesota pay and bonus", "Current tuition reimbursement amount and who qualifies", "What schedule choices exist for each role"], "effort": "medium", "effort_note": "Facts from payroll and site managers for each state, then page edits.", "who": ["HR / benefits (tuition, bonus)", "Area managers (scheduling)", "Web or marketing team (pages, application links)"], "check": ["Whether old pages still appear in search results for Crew Carwash jobs", "Whether candidates ask about the sign-on bonus or tuition amount at first contact"]}], "rewrites": [{"title": "Opening of the customer service ad (Greenfield)", "original": "At Crew Carwash, our Purpose is to “Create Smiles and Lifetime Customers.” As a Full or Part-Time Customer Service Team Member, you will have the opportunity to join a Glassdoor Best Places to Work and achieve your full potential!", "problem": "The ad opens with the customer purpose and two generic promises. The facts a candidate needs come several lines lower.", "logic": "Lead with the role, pay, the entry requirements and what the work is, all taken from the ad. Keep the ranking, stated with its year.", "rewrite": "Full or part-time Customer Service Team Member, Greenfield, Indiana. $15 - $16 per hour + incentive pay, with daily pay options available at no cost to you. No prior work experience is required; you must be at least 16. You will advise and load customers and help keep the site clean, inside and outside. The role requires standing for up to 8+ hours a day and withstanding extended exposure to all weather extremes. Crew Carwash was ranked #1 in the nation on Glassdoor’s Best Places to Work list in 2026.", "notes": [{"kind": "confirm", "text": "That the Indiana role page's fuller description of the work (welcoming customers, explaining wash options, guiding cars onto the conveyor) applies to the Greenfield role, so it can replace the shorter duty line."}, {"kind": "evidence", "text": "How incentive pay is earned and a typical amount, if it can be stated."}, {"kind": "evidence", "text": "What the Glassdoor ranking was based on, for a short line after the ranking."}]}, {"title": "Fast Track Manager ad: training and growth", "original": "Industry-leading training\nIncredible growth potential", "problem": "Two unsupported superlatives stand in for the most important part of a manager-trainee offer.", "logic": "Use the training content stated on the careers page. Leave the growth line out until a real path can be stated.", "rewrite": "Training at no cost. Crew's training covers hands-on management, customer service and sales, car wash technical skills, leadership, running a business, ongoing manager coaching, and safety and CPR certifications.", "notes": [{"kind": "confirm", "text": "Which of the careers-page training topics the Fast Track Manager programme includes, and in what period."}, {"kind": "evidence", "text": "The path after the Fast Track phase and internal promotion figures, before any growth line is added back."}]}, {"title": "Fast Track Manager ad: schedule", "original": "Flexible schedules", "problem": "The ad also requires five days a week including opening, mid and closing shifts, and does not say what is flexible.", "logic": "State the requirement as the schedule, and add flexibility only once its form is known.", "rewrite": "Schedule: 5 days per week, including opening, mid, and closing shifts.", "notes": [{"kind": "evidence", "text": "What Fast Track Managers can choose: days off, shift mix or advance notice."}]}], "questions": [{"kind": "evidence", "for": "communication", "text": "How many current managers started as customer service associates or Fast Track Managers, and how long the move typically took."}, {"kind": "confirm", "for": "communication", "text": "What the Fast Track programme leads to and how long the in-training phase lasts."}, {"kind": "confirm", "for": "communication", "text": "Which of the training topics on the careers page apply to which roles."}, {"kind": "evidence", "for": "communication", "text": "What the 2026 Glassdoor ranking measured and how many reviews it was based on."}, {"kind": "confirm", "for": "communication", "text": "Whether the Maple Grove page figures still apply: $16–18 an hour, the $600 sign-on bonus, tuition help up to $3,500 a year and loan payback help."}, {"kind": "evidence", "for": "communication", "text": "The current tuition reimbursement amount and who qualifies."}, {"kind": "evidence", "for": "communication", "text": "How incentive pay is earned and typical amounts for associates and managers."}, {"kind": "evidence", "for": "communication", "text": "What flexible schedules means for each role: choice of days, shift times, hours or notice."}, {"kind": "confirm", "for": "communication", "text": "Which application route is current: the application chat, Paycor or another portal."}, {"kind": "confirm", "for": "communication", "text": "That the location sentence in the ad template should include Illinois."}, {"kind": "evidence", "for": "communication", "text": "Stories from managers, maintenance technicians, night clean-up staff and Minnesota or Illinois team members, in their own words."}, {"kind": "evidence", "for": "audit", "text": "Screenshots of Glassdoor and Indeed review pages, and of the Facebook, Instagram and LinkedIn accounts, to complete the social media and perception sections."}, {"kind": "evidence", "for": "audit", "text": "Current live job ads from the application chat, including maintenance, night clean-up and Support Center roles."}], "genericity": [{"claim": "Crew Carwash is a Glassdoor Best Place to Work, ranked #1 in the nation in 2026 (all ads, role page, careers page, press release).", "verdict": "partial", "substitution": "breaks", "ubiquity": "common", "specificity": "some", "defensibility": "supportable", "why": "The ranking and its year belong to this employer and could not be reused unchanged. “Best place to work” and “#1” are lexicon phrases, and the material gives no basis for the ranking and no meaning for the employee."}, {"claim": "“Industry-leading training”, with the careers page heading on training leaders.", "verdict": "generic", "substitution": "survives", "ubiquity": "common", "specificity": "some", "defensibility": "supportable", "why": "A comparable car wash employer could publish the claim unchanged. The careers page curriculum adds some substance, but its topics are tied to the category, not to Crew."}, {"claim": "You will have the opportunity to achieve your full potential (all ads), with incredible growth potential (manager ad).", "verdict": "generic", "substitution": "survives", "ubiquity": "ubiquitous", "specificity": "none", "defensibility": "unowned", "why": "Built from lexicon phrases, with no path, programme or figure attached."}, {"claim": "“We're really in the people business, we just happen to wash cars!”", "verdict": "partial", "substitution": "bends", "ubiquity": "rare", "specificity": "some", "defensibility": "supportable", "why": "Attributed to the founder who opened Indiana's first automatic carwash in 1948, which ties it to Crew. No lexicon phrases. Another car wash could say the sentence itself, and the material shows no practice behind it."}], "ledger": [{"claim": "Crew is a Glassdoor Best Place to Work, #1 in the nation in 2026 (ads, careers page, role page, press release)", "class": "core", "evidence": "The press release and the role page name Glassdoor and the year 2026; the press release says Crew was named for the past several years. No criteria or review figures are given.", "strength": "weak", "status": "weak", "comment": "An award shows an assessment took place, but the material does not say what it measured. The ranking is stated only by the employer."}, {"claim": "Training that develops people and leaders; “Industry-leading training” (ads, careers page, role page, press release, Maple Grove page)", "class": "core", "evidence": "Careers page: training at no cost covering hands-on management, customer service and sales, car wash technical skills, leadership, running a business, ongoing manager coaching, safety and CPR certifications. Role page: classroom and on-the-job training. Manager ad: required maintenance work, with thorough training promised.", "strength": "moderate", "status": "partial", "comment": "The material describes what training covers, not what it achieves, so the support is indirect. Nothing supports the industry-leading or award-winning comparison. Which topics apply to which roles is not stated."}, {"claim": "Achieve your full potential; incredible growth potential; growth creates opportunities for team members (ads, team member promise, press release)", "class": "core", "evidence": "Company growth to 60 locations and new site openings in 2026 (press release); the training topics include running a business (careers page).", "strength": "weak", "status": "weak", "comment": "Location growth is a company fact, not evidence of careers. Training content is an input, not a progression path. No promotion figures or routes are given."}, {"claim": "A people-first, fun team culture: the people business line, fun team, values (ads, story page, careers page, role page)", "class": "core", "evidence": "Two associate quotes describing a great team, a fun environment and teamwork (role page); the list of six values (careers page).", "strength": "weak", "status": "weak", "comment": "Short, first-name quotes in general terms, and values without practices."}, {"claim": "Flexible schedules (all ads, careers page, role page)", "class": "supporting", "evidence": "Full and part-time roles with several schedule options (role page); daytime-only roles (careers page); a daytime role at 7AM–4PM Monday to Friday and part-time minimums of 10 or 20 hours a week (ads).", "strength": "moderate", "status": "partial", "comment": "Shows that different schedule types exist, not how much choice a person has. The manager ad's five-day rotation including opening, mid and closing shifts narrows the claim for that role. The 2022 Maple Grove schedule list is not counted for today."}, {"claim": "Team member promise: a safe, rewarding, inclusive environment where people are valued and respected, with clear expectations, training and coaching (careers page, role page)", "class": "supporting", "evidence": "Safety and CPR certifications in the training list (careers page); safety named as the number one value (ads).", "strength": "weak", "status": "weak", "comment": "Evidence touches only the safety part of a much broader promise. Nothing shows how inclusion, respect or coaching work in practice."}]}</script>

app2 += `<h3>${esc(T.app_details)}</h3><div class="tblwrap"><table><tr>${T.det_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${det.map(([id, c]) => `<tr>
<td>${esc((T.dims[id] || [id])[0])}</td><td>${esc(c.name)}</td><td>${c.assessable === false ? esc(T.not_assessable) : `${esc(c.score)}/${esc(c.max)}`}</td><td>${txt(c.note)}</td></tr>`).join('')}</table></div>`;
}
if ((d.sources || []).length) {
app2 += `<h3>${esc(T.app_sources)}</h3><div class="tblwrap"><table><tr>${T.src_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.sources.map(s => `<tr><td>${esc(s.title)}</td><td>${esc(s.type)}</td><td>${esc(s.captured)}</td><td>${safeUrl(s.url) ? `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : ''}</td></tr>`).join('')}</table></div>`;
}
if ((d.materials || []).length) {
app2 += `<h3>${esc(T.app_materials)}</h3><div class="tblwrap"><table><tr>${T.mat_cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${d.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td></tr>`).join('')}</table></div>`;
}
h += sec('appendix', T.sec_appendix, app2);
h += `<footer>${esc(T.footer)}${d.plugin_version ? ` · Employer Brand Auditor v${esc(d.plugin_version)}` : ''}</footer>`;
app.innerHTML = h;
}
try {
render(JSON.parse(document.getElementById('report-data').textContent));
} catch (e) {
app.innerHTML = `<div class="notice">${esc(T.parse_error)}</div>`;
console.error(e);
}
</script>
</body>
</html>
